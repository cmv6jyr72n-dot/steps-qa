<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STEPS</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div class="app">
  <header class="header"><div class="logo-box"><div class="logo-icon">S</div><span class="logo-text">STEPS</span></div></header>
  <main class="main" style="padding:20px">
    <div id="status" style="text-align:center;padding:20px;color:#64748b">正在加载数据...</div>
    <div style="text-align:center;margin-bottom:20px">
      <input type="text" id="q" placeholder="输入关键词搜索" style="width:400px;padding:10px 16px;border:2px solid #e2e8f0;border-radius:10px;font-size:15px;outline:none" autofocus>
      <button id="btn" style="background:#2563eb;color:#fff;border:none;padding:10px 20px;border-radius:10px;cursor:pointer;font-size:14px;margin-left:8px">搜索</button>
    </div>
    <div id="out" style="max-width:800px;margin:0 auto"></div>
  </main>
</div>
<script>
var SUPABASE_URL=https://rstbdvgjgjscxuqzylzw.supabase.co",SUPABASE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzdGJkdmdqZ2pzY3h1cXp5bHp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxMzY5NzUsImV4cCI6MjEwMDcxMjk3NX0.T59_xNg9rGd9OlhmevHc4-s_pka3mPjlL8rpzlsPJXs";
var all=[],pm={};
var st=document.getElementById("status"),q=document.getElementById("q"),btn=document.getElementById("btn"),out=document.getElementById("out");
async function load(){
 try{
  var r=await fetch(SUPABASE_URL+"/rest/v1/qa_entries?select=id,product_id,product_name,product_category,section,question,answer,tags&limit=500",{headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Accept":"application/json"}});
  var j=await r.json();
  all=j;
  j.forEach(function(e){if(!pm[e.product_id])pm[e.product_id]={name:e.product_name,cat:e.product_category}});
  st.textContent="已加载 "+all.length+" 条问答，"+Object.keys(pm).length+" 个产品";
 }catch(e){st.textContent="加载失败: "+e.message}
}
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}
function search(){
 var kw=q.value.trim();
 if(!kw){out.innerHTML="";return}
 var matches=all.filter(function(e){
  return (e.product_name||"").indexOf(kw)>=0||(e.question||"").indexOf(kw)>=0||(e.answer||"").indexOf(kw)>=0
 });
 if(!matches.length){out.innerHTML='<div style="text-align:center;color:#94a3b8;padding:40px">未找到</div>';return}
 var g={};
 matches.forEach(function(e){var p=e.product_id;if(!g[p])g[p]={name:e.product_name,cat:e.product_category,entries:[]};g[p].entries.push(e)});
 out.innerHTML=Object.values(g).map(function(g){
  return '<div style="background:#fff;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:12px;padding:16px"><h3 style="margin:0 0 8px">'+esc(g.name)+'</h3>'+g.entries.map(function(e){return '<div style="padding:10px;border-top:1px solid #f1f5f9"><strong>'+esc(e.question)+'</strong><div style="color:#475569;margin-top:4px;white-space:pre-line">'+esc(e.answer)+'</div></div>'}).join("")+'</div>'
 }).join("")
}
btn.addEventListener("click",search);
q.addEventListener("keydown",function(e){if(e.key==="Enter")search()});
load();
</script>
</body>
</html>
