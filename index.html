<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STEPS 产品问答系统</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div class="app">
  <header class="header"><div class="logo-box"><div class="logo-icon">S</div><span class="logo-text">STEPS</span></div><div class="subtitle">Product Q&A System</div></header>
  <main class="main">
    <div class="hero"><h2>内部产品资料快速查找</h2><p>输入关键词，系统智能识别意图，精准返回答案</p></div>
    <div class="search-wrap">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索产品名称、价格、材质、起订量..." autocomplete="off" autofocus>
        <button class="search-btn" id="searchBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>搜 索</button>
      </div>
      <div class="search-hint">支持搜索：产品名称、材质参数、价格报价、订货规则、施工安装等</div>
    </div>
    <div id="resultsArea" class="results-area" style="display:none">
      <div class="results-summary"><span id="resultsCount" class="results-count"></span><span class="results-query">搜索：<strong id="resultsQuery"></strong></span></div>
      <div id="resultsList"></div>
    </div>
    <div id="emptyState" class="empty-state">
      <div class="empty-icon"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div>
      <div class="empty-text">输入产品相关问题，快速获取答案</div><div class="empty-sub">或点击下方产品查看</div>
      <div class="product-tags-row" id="productTags"></div>
    </div>
    <div id="noResults" class="no-results" style="display:none">
      <div class="no-results-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.2"><circle cx="12" cy="12" r="10"/><path d="m8 8 8 8M8 16l8-8"/></svg></div>
      <div>未找到相关产品信息，请尝试其他关键词</div>
    </div>
  </main>
  <footer class="footer"><span>STEPS &copy; 2026</span><span> &nbsp; &middot; &nbsp; </span><span>内部资料系统</span></footer>
</div>
<div id="loading" class="loading-overlay" style="display:none"><div class="spinner"></div></div>
<script>

const SUPABASE_URL="https://rstbdvgjgjscxuqzylzw.supabase.co",SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzdGJkdmdqZ2pzY3h1cXp5bHp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxMzY5NzUsImV4cCI6MjEwMDcxMjk3NX0.T59_xNg9rGd9OlhmevHc4-s_pka3mPjlL8rpzlsPJXs";
const $=id=>document.getElementById(id);
const esc=t=>{let d=document.createElement("div");d.textContent=t;return d.innerHTML};
const si=$("searchInput"),sb=$("searchBtn"),ra=$("resultsArea"),rl=$("resultsList"),rc=$("resultsCount"),rq=$("resultsQuery"),es=$("emptyState"),nr=$("noResults"),ld=$("loading"),pt=$("productTags");
let st=null,ad=[],pm=new Map();
const colors=["c1","c2","c3","c4"],dc=["blue","emerald","amber","violet"];
const TAG_CN={pricing:"定价",specs:"规格",ordering:"订货",samples:"样品",installation:"施工",shipping:"物流",after_sales:"售后",customization:"定制",quality:"品质",advantages:"优势",certification:"认证",usage:"场景",insulation:"隔音",maintenance:"清洁",partnership:"合作",joints:"拼接",accessories:"配件",marketing:"宣传"};
async function loadAllData(){ld.style.display="flex";try{let r=await fetch(SUPABASE_URL+"/rest/v1/qa_entries?select=*&limit=1000",{headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Accept":"application/json"}});if(!r.ok)throw new Error("HTTP "+r.status);let j=await r.json();if(!Array.isArray(j)||j.length===0)throw new Error("无数据");ad=j;ad.forEach(e=>{if(!pm.has(e.product_id))pm.set(e.product_id,{id:e.product_id,name:e.product_name,cat:e.product_category})});ld.style.display="none";renderTags()}catch(e){ld.style.display="none";throw e}}
function renderTags(){let arr=Array.from(pm.values());if(!arr.length)return;pt.innerHTML=arr.map((p,i)=>'<span class="product-tag" data-query="'+esc(p.name)+'"><span class="tag-dot '+dc[i%4]+'"></span>'+esc(p.name)+"</span>").join("");document.querySelectorAll(".product-tag").forEach(t=>t.addEventListener("click",()=>{si.value=t.dataset.query;doSearch()}))}
function tokenize(t){let m=t.match(/[一-鿿\w]+/g)||[];let r=m.slice();m.forEach(x=>{if(x.length>2)for(let i=0;i<x.length-1;i++)r.push(x.slice(i,i+2))});return r}
function doSearch(){let q=si.value.trim();if(!q){ra.style.display="none";nr.style.display="none";es.style.display="";return}if(!ad.length)return;let tokens=tokenize(q);if(!tokens.length)return;let scored=ad.map(row=>{let s=0,n=(row.product_name||"").toLowerCase();tokens.forEach(t=>{let tl=t.toLowerCase();if(n.indexOf(tl)>=0)s+=4});if(row.tags&&Array.isArray(row.tags))row.tags.forEach(tag=>{let cn=TAG_CN[tag]||"";tokens.forEach(t=>{let tl=t.toLowerCase();if(cn.indexOf(tl)>=0||tag===tl)s+=4})});let q1=(row.question||"").toLowerCase();tokens.forEach(t=>{let tl=t.toLowerCase();if(q1.indexOf(tl)>=0)s+=2});let a1=(row.answer||"").toLowerCase();tokens.forEach(t=>{let tl=t.toLowerCase();if(a1.indexOf(tl)>=0)s+=1});return{row,score:s}}).filter(x=>x.score>0);scored.sort((a,b)=>b.score-a.score);if(!scored.length){ra.style.display="none";es.style.display="none";nr.style.display="";return}es.style.display="none";nr.style.display="none";ra.style.display="";rc.textContent="共找到 "+scored.length+" 条相关问答";rq.textContent=q;let grouped={};scored.forEach(s=>{let pid=s.row.product_id;if(!grouped[pid])grouped[pid]={product_name:s.row.product_name,product_category:s.row.product_category,entries:[]};grouped[pid].entries.push(s.row)});let groups=Object.values(grouped),gi=0;rl.innerHTML=groups.map(g=>{let cards=g.entries.slice(0,5).map(e=>'<div class="result-card"><div class="card-meta"><span class="card-badge">'+esc(e.section)+'</span></div><div class="card-q">'+esc(e.question)+'</div><div class="card-a">'+esc(e.answer).replace(/\n/g,"<br>")+"</div></div>").join("");let color=colors[gi%4];gi++;return '<div class="product-group"><div class="group-header"><div class="group-color '+color+'"></div><span class="group-name">'+esc(g.product_name)+'</span><span class="group-cat">'+esc(g.product_category)+'</span><span class="group-num">'+g.entries.length+" 条匹配</span></div>"+cards+"</div>"}).join("")}
si.addEventListener("input",()=>{clearTimeout(st);st=setTimeout(doSearch,300)});
si.addEventListener("keydown",e=>{if(e.key==="Enter"){clearTimeout(st);doSearch()}});
sb.addEventListener("click",doSearch);
loadAllData();
</script>
</body>
</html>
