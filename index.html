力板", "product_category": "", "section": "价格报价体系", "question": "你们是统一定价还是按规格定价？", "answer": "不是统一价，我们是按厚度、纹理来定价的。同款纹路，5mm、8mm、10mm，价格是不一样的。\n厚度5mm：100-122美金/张\n厚度8mm：188-181美金/张\n厚度10mm：220-290美金/张\n定制炫彩效果,10张以下每张板材加30美元,10张以上每张板材加15美元,无折扣。\n提供裁切雕刻,加工费需提供图纸单独核算 。\n定制渐变效果,无起订量,价格单独核算。\n定制长度超过2440mm的50张起订,价格单独核算。", "tags": ["specs", "pricing"]}, {"id": 379, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "价格报价体系", "question": "批发价是多少？买多了能打折吗？", "answer": "我们统一零售价，折扣要根据采购的数量变动的，买的越多折扣更大。 量大价格谈不按打折，1/2吨起，折算下来价格会便宜一些。", "tags": ["pricing"]}, {"id": 382, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "价格报价体系", "question": "原材料涨价了你们会怎么处理？", "answer": "如果原料涨价或者降价幅度比较大，我们会同步调整板材价格。调价之前会提前7个工作日通知到所有合作客户", "tags": ["specs", "pricing"]}, {"id": 383, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "价格报价体系", "question": "买多了有没有年终返利或者专属优惠？", "answer": "年终返利这块我们目前没有统一政策，但是如果您是大批量采购或者长期合作的客户，可以单独跟我们申请专属优惠，具体方案一对一聊，都是可以谈的。", "tags": ["partnership", "pricing"]}, {"id": 384, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "产品材质基础参数", "question": "你们这个板是什么材质做的？", "answer": "我们用的是进口PMMA亚克力原料。挤出成型生产工艺，E0环保，无有害添加剂，透光率高、硬度好。", "tags": ["specs"]}, {"id": 385, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "产品材质基础参数", "question": "尺寸和厚度有哪些？重量怎么样？", "answer": "标准尺寸就是1220mm×2440mm。厚度分5mm、8mm、10mm三种，不同纹路款式对应的厚度会略有差异。重量这块，这个板的密度只有普通玻璃的十分之一，工人搬运安装方便。具体每片的净重和毛重您可以看我们的官方价格明细表，上面都有标注。", "tags": ["specs"]}, {"id": 386, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "产品材质基础参数", "question": "不同纹路款式的厚度和用料一样吗？", "answer": "用料一样的。全系用的都是同款原料，同厚度不同纹路之间，用料标准完全一致。我们不会因为便宜款就偷工减料，厚度都是严格按标准来的。", "tags": ["specs", "customization"]}, {"id": 387, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "订货采购规则", "question": "最低起订量是多少？", "answer": "现货这边没有起订量，您要一张 有偏差。", "tags": ["customization"]}, {"id": 396, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "颜色纹路定制", "question": "支持颜色定制吗？能做自定义纹路和图案吗？", "answer": "颜色这块支持炫彩定制和渐变色定制；尺寸支持长度定制；还可以做异形雕刻裁切。但是自定义纹路和私人图案这两样目前都做不了。", "tags": ["customization"]}, {"id": 397, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "颜色纹路定制", "question": "定制的起订量和加价是多少？", "answer": "长度定制50张起；炫彩定制：10张以下每张板材加30美元,10张以上每张板材加15美元,无折扣；渐变色定制和雕刻裁切没有起订量，费用根据您的图纸单独报价。", "tags": ["ordering", "customization"]}, {"id": 398, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "颜色纹路定制", "question": "同批次的纹路能保持一致吗？", "answer": "同一批订单我们用同一套模具、同一套工艺生产，纹路间距和凹凸程度高度一致，不会出现同一面墙装出来纹路乱的情况。", "tags": ["customization"]}, {"id": 399, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "颜色纹路定制", "question": "后期补货能保证色差一致吗？", "answer": "补货我们会优先用同款原料、同款配方来生产，整体误差控制在2mm以内，肉眼看不出明显色差。当然不同批次之间会有极细微的差异，这个在行业内是正常的，符合验收标准。", "tags": ["quality", "customization", "after_sales"]}, {"id": 419, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "物理性能", "question": "承重、抗压、抗弯折能力怎么样？", "answer": "抗冲击、抗压、抗弯折都远超普通玻璃。就算受到比较大的外力，也不容易直接断裂，人流密集的地方装上去也放心。", "tags": []}, {"id": 420, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "物理性能", "question": "耐高温低温吗？", "answer": "正常环境是不影响的，不会变形、开裂、发黄，室内场景完全够用。", "tags": ["usage"]}, {"id": 403, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "品质保障", "question": "如果到货发现货样不符或者色差太大怎么处理？", "answer": "。颜色板小块跟大块跟从叠效果都不一样，看您是什么产品，收到货当天验收。有问题当天联系，没有问题不退不换。", "tags": ["quality", "shipping", "after_sales"]}, {"id": 404, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "生产交货周期", "question": "现货多久发货？", "answer": "现货收到付款之后，我们1-3个工作日内打包发货。", "tags": ["ordering", "shipping"]}, {"id": 405, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "生产交货周期", "question": "普通定制款要多久？", "answer": "没有现货的常规款，生产周期是3-7个工作日。", "tags": ["ordering", "customization"]}, {"id": 406, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "生产交货周期", "question": "炫彩、渐变这类特殊定制要多久？", "answer": "炫彩、渐变、加长这类定制款，常规是7-15个工作日；碰上旺季最长不超过20个工作日，我会提前跟您说清楚的。", "tags": ["ordering", "customization"]}, {"id": 407, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "生产交货周期", "question": "旺季会延期吗？延期怎么处理？", "answer": "旺季订单量大，确实有可能顺延3-5天。我们会提前告知您，不会拖着不说。如果您工程项目比较急，可以跟我说，我帮您申请优先排产加急处理。", "tags": ["ordering"]}, {"id": 408, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "包装与运输", "question": "包装是怎么做的？", "answer": "板材正反两面都贴了保护膜，用护角加固后打木箱，防刮、防潮、防磕碰都有做到，适合长短途运输。", "tags": ["shipping"]}, {"id": 409, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "包装与运输", "question": "每箱装几片？重量多少？", "answer": "标准木箱一般可以装60片，少量的会根据数量定制木箱打包，避免运输中叠压损坏。具体的净重和毛重，不同厚度的数据都在官方价格明细表里有", "tags": ["specs", "shipping"]}, {"id": 410, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "包装与运输", "question": "运费怎么算？谁来安排物流？", "answer": "报价是不含运费的，建议您自己找货代，这样最划算。我们合作了全国很多专线物流，您如果要我们代发也行，但价格会贵一些，好处是出了运输问题由我们来跟物流交涉处理。", "tags": ["shipping"]}, {"id": 411, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "包装与运输", "question": "运输途中碎了怎么办？", "answer": "货物出库前是我们厂家的责任，出库后运输过程中的损坏由物流方来担责。我们售后会帮您对接物流走理赔，您只需要提供破损照片和出库单据就可以了。", "tags": ["shipping"]}, {"id": 412, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "包装与运输", "question": "收货的时候要注意什么？", "answer": "到货一定要当场开箱验收，检查外观、数量、有没有破损。如果有问题，当场拍照留证据，马上联系我，这样好处理。签收完就默认货物没问题了，后面再说就麻烦了。", "tags": ["shipping"]}, {"id": 414, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "产品核心优势", "question": "跟长虹玻璃比有什么区别？", "answer": "长虹玻璃是玻璃，易碎、重、不好加工；我们亚克力板轻十分之一，撞坏了不会碎，切割加工简单方便，施工灵活性强很多。装饰效果上，我们的纹路款式更丰富，透光感也很好，价格相对更有竞争力。", "tags": ["advantages"]}, {"id": 415, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "资质证书与环保", "question": "有没有检测报告和资质证书？", "answer": "有的，我们有SGS第三方权威检测报告，涵盖材质、环保、物理性能这几个方向，工程验收、甲方审核都没问题，需要的话我直接发给您。", "tags": ["quality", "certification"]}, {"id": 416, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "资质证书与环保", "question": "环保等级是多少？有没有甲醛？", "answer": "E0顶级环保，甲醛检测未检出，有正规环保检测报告。室内使用完全放心，无异味，符合国内所有建筑装饰工程的验收标准。", "tags": ["certification"]}, {"id": 417, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "资质证书与环保", "question": "防火等级是多少？", "answer": "我要跟您实说，这个亚克力板没有防火阻燃性能，也没有防火检测报告。如果您的项目对防火等级有硬性要求，这个产品可能不适合，我不想到时候影响您的工程验收。", "tags": ["certification"]}, {"id": 418, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "资质证书与环保", "question": "防水防潮怎么样？", "answer": "防水防潮表现很好，有对应的检测资质文件，浴室、厨房、卫生间这类高湿度场景都没问题。", "tags": ["certification"]}, {"id": 421, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "物理性能", "question": "能不能用在户外？", "answer": "不建议长期放在露天户外，因为长期日晒雨淋会加速老化。但封闭式或者半开放式阳台是没问题的，临时户外造型、快闪展览这类短期使用也可以。长期露天外墙就不推荐了。", "tags": ["usage"]}, {"id": 422, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "物理性能", "question": "室内长期用会不会发黄褪色？", "answer": "室内无强光直射的情况下，基本不会发黄褪色，官方建议使用寿命10年以上。避开强光暴晒就可以长期保持原色。", "tags": ["usage"]}, {"id": 423, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "物理性能", "question": "撞上去会碎成碎片吗？", "answer": "不会。受硬物撞击后，最多就是局部凹陷或者轻微弯曲，不会碎成尖角碎片，比玻璃安全多了，特别适合有住宅或者公共场所使用。", "tags": []}, {"id": 425, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "适用场景", "question": "浴室、厨房、卫生间可以用吗？", "answer": "完全可以，防水防潮性能很好，这些高湿度区域装上去没问题，也不需要额外做防水处理。", "tags": ["usage"]}, {"id": 426, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "适用场景", "question": "外墙和露天地方能用吗？", "answer": "封闭阳台和半开放阳台可以用，外墙和完全露天的地方不建议，长期户外日晒雨淋会加速老化，影响使用寿命。", "tags": ["usage"]}, {"id": 427, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "适用场景", "question": "商业场所、酒店、学校、医院可以批量用吗？", "answer": "完全可以，我们有大批量工程采购的服务，商场、高端酒店、密室、展厅、写字楼都有成熟案例，工程量大的可以专门聊合作方案。", "tags": ["usage"]}, {"id": 428, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "隔音保温性能", "question": "装上去有隔音效果吗？", "answer": "有基础的隔音降噪效果，能弱化一部分环境噪音，但我们目前没有专业隔音检测数据，不能给您一个精确的隔音参数。如果您对隔音有很高要求，建议搭配专业隔音材料使用。", "tags": ["insulation"]}, {"id": 429, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "隔音保温性能", "question": "有保温隔热功能吗？", "answer": "有基础的隔热效果，能小幅阻隔热量传递，但不是专业的保温材料，主要还是作为装饰板材来用，保温这块效果有限，我不想夸大给您。", "tags": ["insulation"]}, {"id": 430, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "施工损耗", "question": "平整墙面施工大概损耗多少？", "answer": "正常平整规整的墙面，损耗率大概3%-5%，比较低，浪费不多。", "tags": ["installation", "usage"]}, {"id": 431, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "施工损耗", "question": "弧形或者异形墙面损耗怎么算？", "answer": "弧形、异形墙面因为裁切难度比较大，损耗率会上升到8%-15%，采购的时候记得多备一些料，免得到时候不够用。", "tags": ["installation", "usage"]}, {"id": 432, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "施工损耗", "question": "大工程有没有损耗补贴？", "answer": "百万级或者长期大批量合作的工程项目，我们可以根据您的采购量给予一定的损耗补贴扶持，具体方案单独聊，可以谈。", "tags": ["installation"]}, {"id": 433, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "拼接收口工艺", "question": "板材拼接缝怎么处理？看得出来吗？", "answer": "拼接处用专用亚克力粘合胶水来做无缝粘合，固化之后肉眼基本看不出缝隙，整体效果很干净。", "tags": ["joints"]}, {"id": 434, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "拼接收口工艺", "question": "阴阳角、门窗边、踢脚线这些地方怎么收口？", "answer": "普通场景用中性密封胶打胶封边就行；高端装饰项目的话，可以搭配专用金属收边条，阴阳角、门窗边、踢脚线各种位置都能处理得很好看。", "tags": ["joints"]}, {"id": 435, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "配套配件", "question": "买板材有没有配套安装配件？", "answer": "板材本身不含配件，没有配件", "tags": ["installation", "accessories"]}, {"id": 436, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "安装技术指导", "question": "对基层有什么要求？", "answer": "基层骨架必须平整、干燥、干净、结构牢固，不能有凸起、凹陷或者粉尘，这些基础条件做好了，板材才能装得好、装得稳。", "tags": ["installation"]}, {"id": 437, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "安装技术指导", "question": "安装流程是怎样的？", "answer": "标准流程：量尺寸→板材裁切打磨→基层清洁→打胶→固定板材→微调校准→撕保护膜→收口。说起来步骤多，实际操作不复杂，我们有安装教程视频，发给您看一遍基本就懂了。", "tags": ["installation"]}, {"id": 438, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "安装技术指导", "question": "用什么胶水？能用普通胶水吗？", "answer": "边框固定用中性高透明玻璃胶；板材拼缝这里必须用专用亚克力粘合胶水，普通胶水效果不行，粘不住，这个不能省。", "tags": ["installation"]}, {"id": 439, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "安装技术指导", "question": "配件需要自己买还是你们配？", "answer": "两种方式都行，您可以自己在本地建材市场买，也可以让我们统一配套发货，看您自己方便。", "tags": ["installation", "accessories"]}, {"id": 440, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "安装技术指导", "question": "有安装说明书吗？有没有技术支持？", "answer": "有的，免费提供纸质版和电子版安装说明书，复杂造型项目还可以提供施工参考图纸。安装过程中有问题，可以找我们远程视频指导，有问题随时联系。", "tags": ["installation"]}, {"id": 441, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "施工工期与环境", "question": "全屋装完大概要几天？", "answer": "普通小户型1个工作日基本能装完，大面积商业空间或者造型复杂的项目就要根据实际面积来算了。", "tags": ["installation"]}, {"id": 442, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "施工工期与环境", "question": "施工过程有没有很多粉尘和异味？", "answer": "施工很干净，裁切打磨产生的粉尘量很少，胶水也没有刺激性异味，施工环境对业主影响很小。", "tags": ["installation"]}, {"id": 443, "product_id": "亚克力板问答", "product_name": "Y系列亚克力板", "product_category": "", "section": "施工工期与环境", "question": "装好了要等多久才能用？", "answer": "装完当天就可以直接 处理，相关差旅、人工费用由双方协商承担。\n产品表面灰尘、污渍标准清理方式？\n日常浮灰使用干抹布、吸尘器清理；轻度污渍用清水搭配软布擦拭即可；顽固污渍可使用中性清洁剂擦拭，随后用清水擦净晾干。\n表面是否支持直接使用清水、湿布擦拭清洁？\n完全支持，砖体表面致密防水，可直接用清水、湿布反复擦拭，清洁简单易打理。\n产品耐刮耐磨程度，日常养护注意事项？\n表面耐刮耐磨，日常正常清洁、触碰不易产生划痕；养护需避免使用强酸、强碱类清洁剂，避免尖锐硬物大力刻划、敲击。\n合作物流运输渠道，整车、零担发货规则？\n长期合作国际物流代理商，渠道稳定；发达国家可门到门，偏远港口自提；我方可协助客户办理清关手续，多数国家30~60天到货。\n边角破损开裂、肉眼明显色差，均判定次品。", "tags": ["maintenance"]}, {"id": 545, "product_id": "发泡陶瓷通用产品供应商调研问答清单", "product_name": "发泡陶瓷通用产品供应商调研问答清单（广东云浮）", "product_category": "", "section": "价格报价体系板块", "question": "产品品类，常规构件价格低，异形构件、线条、造型件因模具成本高，价格上浮40%-60%；？", "answer": "（六）发泡陶瓷的价格波动大吗？\n整体价格波动很小。原料都是工业固废，价格常年平稳，核心成本是烧制能耗、模具和人工，这类成本变动幅度低，所以成品售价长期稳定，不会出现大幅涨跌。\n（一）产品主要原材料构成、材质等级、详细成分说明？\n主要原料为陶土尾矿，陶瓷碎片，石料等等工业固废，固废占比85%以上，搭配长石、黏土以及无机发泡剂，经1200℃以上高温烧结成型。具体配比属于工厂保密配方，不对外公示。\n（二）产品标准长宽尺寸、常规厚度、单平米/单件重量、密度参数？\n规格多变，有常规发泡陶瓷砖195*195*100mm和肌理板290*290/390*390mm等 常规构件单件重量：常规肌理板单件重量：密度分别为：\n（三）同系列不同款式产品，材质、用料厚度是否保持一致？\n同一系列产品，基础材质、基材厚度完全统一，仅表面做不同工艺处理，内部基材没有区别。\n（一）产品最低起订量标准，单款最少订货数量/平方？\n常规款式起订量10个，做颜色最低起订量150个\n（二）是否支持零散下单、单件发货，小批量订单价格与大批量差价？\n支持零散下单、单件发货。小订单需要单独打木架、做加固包装，不享受批量优惠，零散单价格比大批量采购贵20%-35%。\n（三）厂家常备现货规格款式范围，无现货产品订货要求？\n没有现货，要根据订单制作\n（四）订单下单流程、定金缴纳比例、尾款结算方式、付款相关要求？\n确认报价→核对色卡图纸→签订PI →付定金→排产生产→发货前结清尾款；定金统一收取30%~50%。\n（一）样品申领规则，是否免费提供样品，常规样品规格尺寸？\n常规样品收取4.8美元一个，定制色、异形工艺的样板要另外收取工本费。\n（二）样品是否收取工本费、快递运费，大货下单后样品费用能否抵扣货款？\n样板和运费全部客户支付；指定颜色样品需要收取开机费和打样费，具体费用另议，客户后续大货满300㎡，样板费可以抵扣货款。\n（三）样品发货时效，下单后多久可以寄出、签收周期？\n现货样品下单后3-5天可以寄出，定制类样品7~15天安排寄出，东南亚最快2-3天即可送达，其他国家则需要大致2周。\n（一）厂家现有全套标准色卡、所有常规颜色品类？\n参考劳尔色卡，里面的颜色都可以做。\n（二）是否支持颜色定制、纹路定制、图案定制服务？\n支持颜色、纹路、图案定制\n（三）定制产品具体要求、定制起订量、额外加工费用？\n做颜色最低起订量150个，相应价格看以下规格:\n200*200mm以内另+2.81 USD/PCS，\n300*300mm以内+6.19美USD/PCS，\n400*400mm以内+10.98 美USD/PCS，\n小层叠+3.09美USD/PCS\n大层叠+5.91美USD/PCS\n做颜色的样品单个或几个打样上色84.50美元一次。\n（颜色上的优惠:500-1000个98折，1000-1500个96折，1500-2000个95折，2000个以上94折，最低94折。例如：500个200*200mm以内的做颜色，原本颜色费是+2.81 USD/PCS，可以打折2.81*0.98。为啥颜色这么贵？因为需要人工拿单个产品360度喷色，会很费油漆和人工）\n（四）同批次产品纹路如何统一，怎样避免纹路重复影响整体美观？\n受高温烧结工艺影响，同批次板材气孔大小会有细微自然差异\n（五）后续补货订单，能否严格把控色差，色差控制标准是什么？\n补货订单会存在色差，因为每一批次的漆会存在色差，因此难以避免。\n（一）如何保证寄送小样与大批量出货产品，质感、厚度、颜色、纹理保持一致？\n样品和大货使用同一批次原料、同一条生产线烧制。签订合同后我方会封存样品，大货全程按照封样标准生产、验收。\n（二）不同生产批次产品，色差、质感允许偏差范围？\n肉眼直视无明显色块、深浅差异，表面光泽、触感、纹理质感基本统一\n（三）产品出厂质检流程、出厂合格标准？\n出厂逐批检查板材尺寸、厚度、平整度是否符合要求；保温隔声板材抽检内部闭孔完整性。轻微边角小磕碰（5mm以内）属于运输正常范围，不影响使用。\n（四）若出现货样不符、色差严重、密度不均等质量问题，厂家处理方案与赔付规则？\n出货前会提供图片和视频验货，和小样对比视频，双方同意后发货，基本不会出现色差、版型和封样不一致的情况。\n（一）现货产品常规下单后发货时长？\n3~7天\n（二）标准常规订单生产周期、整体交货时间？\n常规颜色、常规工艺的生产周期20-30天。\n（三）专属定制产品生产周期、最长交货期限？\n颜色定制、尺寸定制产品，周期30天以上；异形构件、开模定制产品，需要根据设计图纸、尺寸、数量、复杂程度来协商沟通。\n（四）订单高峰期 是否存在延期情况，延期应对处理方案？\n生产旺季订单爆满最多延期7~10天；老客户还会优先锁单和排产。\n（一）产品标准包装方式、包装材质、防护处理工艺？\n统一采用实木框架+加厚木箱包装，板材之间铺垫珍珠棉、硬纸板隔离，边角加装护角防护，长途运输额外缠绕防水膜。出口货物按照国际海运标准加固包装。\n（二）整箱外包装长宽高尺寸、标准装箱数量？\n以产品尺寸295*195*120mm为例，88个，实际包装尺寸是1670*700*960mm/190kg\n（无纸箱，用木箱或木托打包）\n（三）产品单件净重、整箱毛重详细数据？\n195*195*100mm规格 重量约1KG，一箱250个\n（四）如需定制专属包装，收费标准如何？\n目前只使用工厂统一标准木箱，暂不接受个性化专属包装。若有特殊包装要求，双方一事一议。如需单独装袋，规格200mm以下+0.28USD/PCS，规格200-300mm以下+0.56USD/PCS，规格300-400mm以下+0.98USD/PCS\n（五）包装是否具备防潮、防震、防磕碰、防雨运输防护功能？\n防护功能齐全，内部珍珠棉防震、护角防磕碰，外层防水膜+木箱，海运、陆运都能做到防潮、防雨、防撞击，大幅降低运输破损率。\n（一）对比市面同类产品，本产品核心优势、主打卖点？\n这款发泡陶瓷通过陶土废料经过1200度高温烧制而成，主打轻质高强、A1级防火、全防水防潮、保温隔热、隔音降噪、耐候耐用六大核心优势。而且还易安装，可节约15%建筑结构钢筋；可随意定制各种大型异形图案，户外门头，别墅墙面花纹装饰等，节约制作复杂造型成本。还能替代传统砖块、石材，性价比更高。\n（二）工艺优势、原材料优势、性价比优势、工程落地优势详细介绍？\n原料选用陶土尾矿，陶瓷碎片，石料等作为主要原料，绿色环保还实现资源再利用，成本可控。经1200℃高温一体烧结成型，无粘接层，不会出现脱层、脱落问题。发泡陶瓷自身重量轻，工人搬运、安装都更省力，施工效率比传统石材、混凝土提升40%以上。不管是室内装饰、外墙保温、市政线条、古建筑修复，都能直接落地，款式多样、尺寸灵活，是工装、家装、市政工程的优选材料。\n（一）产品具备哪些行业正规证书、第三方权威检测报告？\n有国家建筑工程材料质量监督检验中心的检验检测报告\n‬﻿‍检测报告超链接：\n​‬​‬​​⁠‬​​​​​​﻿​​​​​‍​⁠⁠‌​‍​﻿‌​‌﻿​​​‬​﻿﻿‍​‍​⁠​发泡陶瓷-10公分厚物理检测报告.pdf - 飞书云文档\n产品环保等级标准，有无正规环保检测报告？\n属于高等级无机环保建材，附带正规环保检测报告，无甲醛、无放射性物质。\n甲醛及有害物质释放指标，是否符合国内建筑验收标准？\n全程高温烧结而成，零甲醛、零挥发性有害物质，放射性指标远低于国标，完全符合GB50325建筑工程验收标准，家装、工装都能放心使用。\n产品防火等级具体级别，是否具备防火检测报告？\nA1级不燃防火，配有第三方权威防火检测报告，高层建筑、消防重点区域都可使用。\n防水防潮等级，相关检测资质文件？\n吸水率＜0.3%，疏水不渗水、不霉变、不生锈，具备防水、抗冻融、防腐专项检测报告，长期在潮湿环境、露天环境使用不变形。\n产品物理性能板块\n（一）产品标准承重、抗压、抗弯折性能参数？\n常规板材抗压强度为6.6MPa，单点吊挂力可达100公斤以上，可直接悬挂空调、电视、热水器等重物，无需额外加固；抗弯强度表现稳定，不易断裂。板材属于装饰保温材料，不能当作建筑主梁承重使用，适合隔墙、吊顶、幕墙、外墙装饰。\n（二）产品耐温范围，最高耐受温度、最低耐受温度？\n长期使用耐温区间：-50℃~1000℃，高低温环境下不变形、不开裂；短时可耐受更高温度，遇明火不熔化、不燃烧，严寒地区、高温厂房、户外暴晒环境都能稳定使用。\n（三）户外使用耐候性、抗风雨、抗老化性能表现？\n整体为无机陶瓷材质，抗酸雨、耐盐雾、抗风雨冲刷，抗冻融循环超100次。露天户外长期使用，不会粉化、风化、锈蚀，耐候性远超普通保温板和有机装饰材料。\n（四）长期阳光直射环境下，白色产品是否发黄、深色产品是否褪色，质保年限？\n高温烧制的基材本色稳定性极强，与建筑同寿命，喷色款式10-20年。\n（五）人流密集区域受硬物撞击后，产品形态为凹陷还是碎裂？\n板材有一定脆性，受到普通钝器撞击，表面不会大面积碎裂；遭遇尖锐硬物强力撞击，局部会出现小破损，不会整块脱落、飞溅碎片，公共区域使用安全性较高。\n（一）产品常规适用安装空间有哪些？\n室内隔墙、吊顶、背景墙、机房隔音墙、会议室隔断；外墙保温装饰、建筑门头、包柱、外墙线条、走廊墙面等。\n（二）潮湿区域如浴室、厨房、卫生间是否可以正常安装使用？\n完全可以。防水防潮、不吸水、不发霉、不生锈，厨卫、地下室、地下车库等高湿环境都能长期使用。\n（三）外墙、阳台、露天室外场地是否适配？\n高度适配。耐暴晒、抗风雨、耐冻融，高层外墙、露天阳台、屋顶、户外造型构件都可正常安装使用。\n（四）商场、酒店、学校、医院、走廊过道等商业公共区域能否工程批量使用？\n非常适合批量工装。A1级防火、环保无异味、隔音效果好、易清洁、耐磨损，完全满足各类商业、公共建筑的批量施工要求。\n（五）市政道路、高架桥、轨道交通、隧道降噪能否使用？\n可以用作降噪隔声板材，100mm厚板材隔声量可达45-55dB，耐候抗腐、使用寿命长，适配市政声屏障、隧道、轨道交通降噪工程。\n（一）产品安装完成后隔音效果、隔音相关参数？\n依靠独立闭孔结构实现隔音，30mm厚板材基础隔声效果良好，100mm厚标准板材空气隔声量可达45-55dB，墙体搭配空腔结构，隔音效果会进一步提升，适合分户墙、走廊、机房等场景。\n（一）平整标准墙面常规施工损耗率？\n标准整板拼接施工，损耗极低，仅在墙面收口、边角位置产生少量裁切损耗，整体损耗率一般在2%-3%；复杂造型需根据现场图纸精准测算。\n（二）弧形墙面、异形不规则墙面通用施工损耗比例？\n可加工弧形板材，弧形、异形墙面损耗会略高，常规损耗率5%-8%，具体以施工图纸和现场造型为准。\n（一）产品拼接缝隙处理方式，如何淡化拼缝痕迹？\n尽量将拼接缝设置在龙骨位置，可以自然留缝，使用美缝剂处理，弱化缝隙\n（一）产品配套全套安装配件包含哪些品类？\n我们不配套供应安装配件，您可以在当地自行采购。\n（一）产品安装基层条件、基础施工技术要求？\n墙面处理跟瓷砖一样，用云石胶或瓷砖胶一块块粘连上墙，如是木板底，则用结构胶粘连;如不依托墙体安装，视具体尺寸大小考虑除了用胶外还需加筋加固。\n（二）安装专用胶水型号、辅料指定品类？\n墙面处理跟陶瓷一样，用云石胶或瓷砖胶一块块粘连上墙，如是木板底，则用结构胶粘连;如不依托墙体安装，视具体尺寸大小考虑除了用胶外还需加筋加固。\n（五）安装辅料配件随货配送，还是采购方自行本地采购？\n所有安装辅料、配件均由采购方本地采购，我们不随货配送。\n（六）厂家是否提供正规安装说明书、施工图纸？\n免费提供电子版安装说明书、施工实拍图、现场安装视频。\n（七）是否提供远程视频技术指导、安装售后答疑服务？\n提供免费一对一远程视频安装指导，施工过程中遇到问题可实时答疑，大型工地可预约线上现场技术交底。\n（一）全屋整体安装标准完工周期？\n100㎡室内墙面粘贴施工，正常2-3天完工；100㎡外墙干挂施工，一般4-7天完工，具体看现场造型和施工条件。\n（二）施工过程是否产生大量建筑垃圾、粉尘异味？\n以干法施工和简单裁切为主，现场粉尘少、无异味、无有害挥发物，建筑垃圾只有少量裁切边角料，属于环保施工。\n（三）施工完成后多久可以正常投入使用？\n干挂施工安装完成即可使用；粘贴施工待粘结剂完全固化（一般24小时）后正常投入使用。\n（一）产品官方标注正常使用寿命年限？\n常规使用50年以上\n（二）长期使用是否出现变色、开裂、脱落、老化等问题？\n一体烧结无分层，正常使用不会开裂、脱落、粉化；优质釉面长期使用不褪色，仅极端强酸强碱环境下会出现轻微老化。\n（三）产品统一质保期限，质保范围详细说明？\n出厂板材无缺角、开裂、大面积掉釉、严重色差即为合格产品。质保范围：非人为因素出现的基材开裂、大面积脱釉；人为撞击、自行切割改造 馆、瑜伽馆、潮牌店整案采购；单次采购面积超500㎡的超大工程，可在工程底价基础上另行协商优惠。", "tags": ["partnership", "pricing"]}, {"id": 622, "product_id": "杜邦纸产品问题", "product_name": "# 杜邦纸（Tyvek特卫强）", "product_category": "", "section": "", "question": "报价是否包含税费、运费、裁切费，可开具发票类型、对应税率？", "answer": "所有报价仅为杜邦纸基材单价，不含国际海运、陆运运费、出口包装费用及税费；裁切费仅针对50㎡以上订单收取，标准0.18美元/㎡；运输货代可由客户自行安排，厂家可协助对接物流渠道；如需开具发票，税费另行加收，常规可开具增值税专用发票、增值税普通发票，税率按照行业通用标准执行。", "tags": ["shipping", "pricing"]}, {"id": 625, "product_id": "杜邦纸产品问题", "product_name": "# 杜邦纸（Tyvek特卫强）", "product_category": "", "section": "", "question": "杜邦纸的价格受到哪些因素的影响？", "answer": "核心定价影响因素包含材质类型，价格从低到高依次为软质1443R、硬质1056D、硬质1073D；其次分为白色原生款、彩色染色款，彩色款成本更高；同时宽幅规格、采购总面积、裁切加工费、10%施工损耗、国际原料行情、物流运输成本均会最终影响整体采购价格。", "tags": ["pricing"]}, {"id": 626, "product_id": "杜邦纸产品问题", "product_name": "# 杜邦纸（Tyvek特卫强）", "product_category": "", "section": "", "question": "杜邦纸的价格波动大吗？", "answer": "现货白色原生款整体价格稳定；彩色染色款受染色加工成本影响存在小幅浮动；仅在国际聚乙烯原料大幅涨价时全系列产品小幅上调单价，整体波动幅度可控。", "tags": ["pricing"]}, {"id": 627, "product_id": "杜邦纸产品问题", "product_name": "# 杜邦纸（Tyvek特卫强）", "product_category": "", "section": "", "question": "杜邦纸的价格趋势是怎么样的？", "answer": "标准白色现货款价格长期保持平稳；受进口原料、人工裁切、染色加工、海关相关成本逐年上涨影响，整体价格呈缓慢小幅上行趋势；彩色定制款涨幅高于基础白色现货款。\n## 二、产品材质基础参数板块", "tags": ["pricing"]}, {"id": 628, "product_id": "杜邦纸产品问题", "product_name": "# 杜邦纸（Tyvek特卫强）", "product_category": "", "section": "", "question": "产品主要原材料构成、材质等级、详细成分说明？", "answer": "基材为美国进口Tyvek特卫强高密度聚乙烯（HDPE），采用上世纪50年代蒸馏热熔长丝热粘合工艺生产，全程不使用回收废料，产品符合进出口建材、文创、医疗包装行业标准；产品分为硬质、软质两大结构，硬质型号1056D、1073D挺括不易变形，软质1443R轻薄柔韧可弯折；染色款以原生白色基材后期上色，采用环保染料，室内装饰使用无异味。", "tags": ["specs"]}, {"id": 629, "product_id": "杜邦纸产品问题", "product_name": "# 杜邦纸（Tyvek特卫强）", "product_category": "", "section": "", "question": "同系列不同款式产品，材质、用料厚度是否保持一致？", "answer": "同一型号产品基材材质、厚度、克重完全统一，仅区分白色原生款与彩色染色款；不同型号参数存在明显区分：1056D克重55g/㎡，厚度0.170mm；1073D克重73g/㎡，厚度0.205mm；1443R克重43g/㎡，厚度0.135mm。", "tags": ["specs"]}, {"id": 630, "product_id": "杜邦纸产品问题", "product_name": "# 杜邦纸（Tyvek特卫强）", "product_category": "", "section": "", "question": "产品标准宽幅、常规克重、厚度参数？", "answer": "宽幅规格：硬质1056D、1073D可选1092mm、1500mm；软质1443R统一宽幅1524mm；克重标准：1056D为55g/㎡，1073D为73g/㎡，1443R约42.4g/㎡；厚度标准：1056D厚度0.17mm，1073D厚度0.205mm，1443R厚度0.135mm。\n## 三、订货采购规则板块", "tags": ["specs"]}, {"id": 631, "product_id": "杜邦纸产品问题", "product_name": "# 杜邦纸（Tyvek特卫强）", "product_category": "", "section": "", "question": "产品最低起订量标准，单款最少订货面积？", "answer": "产品无强制最低起订量，支持零散小面积采购；50㎡以内订单执行零售高价，免收裁切费；采购面积50㎡以上可享受阶梯降价，收取0.18美元/㎡裁切费，采购总量额外增加10%损耗面积。", "tags": ["ordering"]}, {"id": 632, "product_id": "杜邦纸产品问题", "product_name": "# 杜邦纸（Tyvek特卫强）", "product_category": "", "section": "", "question": "是否支持零散下单、单件裁切发货，小批量订单价格与大批量差价？", "answer": "支持零散裁切、小订单单独发货；50㎡以内采购单价远高于200㎡以上工程单，采购面积越大，单平米单价越低，价格差距明显。", "tags": ["shipping", "ordering", "pricing"]}, {"id": 633, "product_id": "杜邦纸产品问题", "product_name": "# 杜邦纸（Tyvek特卫强）", "product_category": "", "section": "", "question": "厂家常备现货规格款式范围，无现货产品订货要求？", "answer": "现货库存覆盖全型号白色原生杜邦纸，包含1056D、1073D、1443R全部标准宽幅；彩色染色款多为定制生产，交货周期略有延长，无硬性起订面积限制，按照实际采购面积核算价格。", "tags": ["specs", "ordering"]}, {"id": 634, "product_id": "杜邦纸产品问题", "product_name": "# 杜邦纸（Tyvek特卫强）", "product_category": "", "section": "", "question": "订单下单流程、定金缴纳比例、尾款结算方式、付款相关要求？", "answer": "完整下单流程：客户询价→确认产品型号、宽幅、白/彩色、采购面积（加计10%损耗）→核对总报价→签订购销合同→支付定金→工厂备货裁切→发货前核对出货清单→付清全部尾款后安排发货；常规订单定金收取比例为50%，尾款需在发货前全额结清。\n## 四、样品服务相关板块", "tags": ["ordering"]}, {"id": 635, "product_id": "杜邦纸产品问题", "product_name": "# 杜邦纸（Tyvek特卫强）", "product_category": "", "section": "", "question": "样品申领规则，是否免费提供样品，常规样品规格尺寸？", "answer": "不提供免费样品，常规一米长样品做成一小卷；如需整套软硬材质对比样、全套染色色卡，额外收取样品材料费与快递运费。", "tags": ["specs", "samples"]}, {"id": 636, "product_id": "杜邦纸产品问题", "product_name": "# 杜邦纸（Tyvek特卫强）", "product_category": "", "section": "", "question": "样品是否收取工本费、快递运费，大货下单后样品费用能否抵扣货款？", "answer": "样品裁切收取工本费，国内、国际快递运费均由客户承担；客户下单批量大货且达到对应采购面积标准后，样品费用可按照公司规则抵扣货款。", "tags": ["samples", "ordering", "shipping"]}, {"id": 637, "product_id": "杜邦纸产品问题", "product_name": "# 杜邦纸（Tyvek特卫强）", "product_category": "", "section": "", "question": "样品发货时效，下单后多久可以寄出、签收周期？", "answer": "白色现货样品在客户付款完成后2-3个工作日内安排寄出；彩色染色样品付款后5-7个工作日寄出；国际物流签收时长根据所选运输渠道而定。", "tags": ["samples", "ordering", "shipping"]}, {"id": 638, "product_id": "杜邦纸产品问题", "product_name": "# 杜邦纸（Tyvek特卫强）", "product_category": "", "section": "", "question": "可否一次性提供多款颜色、软硬材质全套样品？", "answer": "可一次性提供全套软硬材质样品、全色系染色色卡，全部样品按照实际裁切面积统一计费，多款样品可合并一单发货。\n## 五、颜色纹路定制板块", "tags": ["specs", "samples", "customization"]}, {"id": 639, "product_id": "杜邦纸产品问题", "product_name": "# 杜邦纸（Tyvek特卫强）", "product_category": "", "section": "", "question": "原生白色杜邦纸有无色差？", "answer": "原厂进口白色基材无明显色差，同批次、不同批次白色基底视觉效果统一。", "tags": ["quality"]}, {"id": 649, "product_id": "杜邦纸产品问题", "product_name": "# 杜邦纸（Tyvek特卫强）", "product_category": "", "section": "", "question": "订单高峰期是否存在延期情况，延期应对处理方案？", "answer": "建材旺季裁切订单量大，最长延期3-5天；厂家会提前主动告知客户，优先保障大面积工程订单排产发货。\n## 八、包装规格及费用板块", "tags": ["specs", "shipping", "ordering"]}, {"id": 1299, "product_id": "石膏灯产品客户问答清单_24板块完整版_", "product_name": "石膏灯产品客户问答清单", "product_category": "", "section": "生产交期板块", "question": "正常交货多久？", "answer": "答：常规产品7-20天，定制产品根据复杂程度确认。", "tags": ["ordering"]}, {"id": 641, "product_id": "杜邦纸产品问题", "product_name": "# 杜邦纸（Tyvek特卫强）", "product_category": "", "section": "", "question": "不同材质颜色适配使用场景？", "answer": "白色原生款适配工装、家装、文创包装、医疗灭菌包装、防护服等全场景；彩色染色款仅推荐室内干燥装饰空间，如展馆、服装店、瑜伽馆，不适合长期户外暴晒使用。", "tags": ["specs", "usage", "customization"]}, {"id": 642, "product_id": "杜邦纸产品问题", "product_name": "# 杜邦纸（Tyvek特卫强）", "product_category": "", "section": "", "question": "通用定制色差补充说明？", "answer": "同一批次基材统一染色，透光纹理、色彩效果保持一致；补货订单会优先匹配原批次原料，无法完全杜绝轻微色差，整体空间视觉统一即判定合格。\n定制尺寸最宽、最长可以是多少？常规1.6宽，定制3.01米宽，长度1000米一卷\n## 六、样品与大货品质保障板块", "tags": ["quality", "customization"]}, {"id": 643, "product_id": "杜邦纸产品问题", "product_name": "# 杜邦纸（Tyvek特卫强）", "product_category": "", "section": "", "question": "如何保证寄送小样与大批量出货产品，克重、厚度、透光质感保持一致？", "answer": "样品与大货使用同一批次进口原料、同一整卷原材裁切；签订订单时双方共同封样，大货生产、验收严格对照封样的厚度、克重、透光纹理标准执行。", "tags": [ ，电脑精确控制喷涂厚度、色泽和纹理，再经过高温烘烤或 UV 光固化，确保每块板材颜色、光泽和质感高度一致。\n​​表面加工多样：支持拉槽、雕刻、钻孔等二次加工，拉槽工艺能形成规则或不规则的槽形纹路，提升墙面美观度同时改善通风条件，还能增强板材与基层间的粘结效果。\n​​无需二次喷涂：出厂即是成品状态，彻底杜绝现场喷涂的质量通病和环境污染，施工流程简化为\"裁切、安装\"两步，能缩短至少 50%以上的幕墙施工周期。\n​​干法施工便捷：采用打胶螺丝安装方式或龙骨固定，板缝预留 3-5mm 便于伸缩处理，不受季节气候和地理环境限制，加快工程进度。\n原材料优势\n​​环保安全：以无机材料为主（水泥 + 矿物纤维/纤维素增强），不含石棉等有害物质，放射性指标符合国家标准，属于绿色建材。\n​​结构致密稳定：水泥颗粒与高性能纤维混合后经过高压压制形成紧密结构，赋予高强度和良好的抗冲击性，强度随时间增长而提升。\n​​防水防潮配方：表面致密不易渗水，可在高湿度环境中保持性能稳定，避免变形或腐蚀，适用于浴室、地下室等潮湿区域。\n性价比优势\n​​价格区间合理：成本高于普通石膏板但低于石材、金属板等高端材料。\n​​仿效高端材质：可定制清水混凝土质感、仿铝板、仿石材等多种纹理效果，以较低成本实现类似石材或金属幕墙的视觉效果，是铝板幕墙的高性价比平替方案。\n​​综合成本更低：虽然单价比石膏板略高，但防火防潮性能优异可减少后期维护费用；工厂预制减少现场人工和时间成本；使用寿命长且不易老化腐蚀，全生命周期成本更具优势。\n​​预算可控性强：可根据实际情况选择基础款或定制款，通过调整规格和铺设面积来控制整体支出，适合从住宅到商业工程的不同预算需求。\n工程落地优势\n​​适用范围广：可用于室内隔墙、吊顶、地面基层、外墙装饰等多种场景，也适用于厂房、仓库、医院、学校、商业空间等各类建筑项目。\n​​验收通过率高：A1 级不燃防火性能、防水防潮、抗冻融、防霉等特性满足各类建筑规范要求，源头工厂供货品质稳定，工程上不返工才是最大的省钱。", "tags": ["specs", "advantages"]}, {"id": 737, "product_id": "水泥装饰板调研", "product_name": "# 建材通用产品供应商调研问答清单", "product_category": "", "section": "资质证书与环保检测板块", "question": "产品具备哪些行业正规证书、第三方权威检测报告？", "answer": "防火等级达到A1 级不燃材料，持有专业防火检测报告，适用于各类公装、家装防火场景。", "tags": ["quality", "certification"]}, {"id": 738, "product_id": "水泥装饰板调研", "product_name": "# 建材通用产品供应商调研问答清单", "product_category": "", "section": "资质证书与环保检测板块", "question": "产品环保等级标准，有无正规环保检测报告？", "answer": "环保等级：E0级（甲醛未检出）；具备国家建材环保检测报告。", "tags": ["quality", "certification"]}, {"id": 739, "product_id": "水泥装饰板调研", "product_name": "# 建材通用产品供应商调研问答清单", "product_category": "", "section": "资质证书与环保检测板块", "question": "甲醛及有害物质释放指标，是否符合国内建筑验收标准？", "answer": "甲醛：未检出（≤0.03mg/m³）；符合GB 50325-2020《民用建筑工程室内环境污染控制标准》。", "tags": ["quality", "certification", "after_sales"]}, {"id": 756, "product_id": "水泥装饰板调研", "product_name": "# 建材通用产品供应商调研问答清单", "product_category": "", "section": "拼接收口工艺板块", "question": "产品拼接缝隙处理方式，如何淡化拼缝痕迹？", "answer": "采用专用填缝剂 + 同色系收边辅料填充，搭配表面统一做涂装 / 覆膜处理，最大程度弱化拼接缝隙。", "tags": ["installation", "accessories", "joints"]}, {"id": 757, "product_id": "水泥装饰板调研", r": "核心材料是高强度水泥、精选高纯石英砂、超细矿物粉、进口助剂、专用增强纤维和进口无机色粉。整体属于无机材料体系，防火等级可达A1级，适合外墙和工装项目使用。", "tags": ["certification", "customization", "specs", "usage", "advantages"]}, {"id": 917, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "产品材质基础参数板块", "question": "常规尺寸、厚度和重量是多少？", "answer": "3D水泥砖尺寸跨度较大，常见规格包括100x50mm、200x200mm、400x100mm、600x125mm，以及600x600mm、300x300mm等板型。常规厚度一般在12mm-60mm之间，部分薄款约12mm，部分中空造型可达到60mm；整平米重量通常在15kg-64kg/㎡之间，堆积密度一般在2.0-2.4g/cm³。", "tags": ["specs"]}, {"id": 918, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "产品材质基础参数板块", "question": "同系列不同款式，材质会变吗？", "answer": "不会变。材质和水泥基配方保持一致，但由于造型曲面、波峰波谷和镂空结构不同，厚度、重量和单片用料会有差异。", "tags": ["specs"]}, {"id": 919, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "订货采购规则板块", "question": "最低起订量是多少？", "answer": "无现货，定制款一般是10平米起订", "tags": ["customization", "ordering"]}, {"id": 920, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "订货采购规则板块", "question": "支持零散下单和单件发货吗？", "answer": "支持，但是因为重货物流和打托包装成本较高，小批量订单的单价通常会比批发价高20%-40%。", "tags": ["pricing", "shipping", "ordering"]}, {"id": 921, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "订货采购规则板块", "question": "下单流程和付款方式是什么？", "answer": "通常是：选型确认、开发票、支付定金、排产生产、验货确认、结清尾款、打包发货。常规标准款定金一般定金一般50%，尾款需在装车出库前结清。", "tags": ["ordering"]}, {"id": 922, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "样品服务相关板块", "question": "样品免费吗？", "answer": "样品是收费的，通常按零售价单片计算，样品尺寸一般就是单个成品尺寸。", "tags": ["pricing", "samples", "specs"]}, {"id": 923, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "样品服务相关板块", "question": "样品费和运费能不能抵扣？", "answer": "调色样板一般150元一款，下单20平方可以抵扣货款。\n普通样板按报价表，下单20平方也可以抵扣。", "tags": ["samples", "customization", "ordering", "pricing", "shipping"]}, {"id": 924, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "样品服务相关板块", "question": "样品多久能寄出？", "answer": "现货样品下单后3-5天可以寄出，定制类样品7~15天安排寄出，东南亚最快2-3天即可送达，其他国家则需要大致2周。", "tags": ["samples", "customization", "ordering"]}, {"id": 925, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "样品服务相关板块", "question": "可以一次拿多款样品吗？", "answer": "可以，客户确认选购后即可安排多款颜色和纹路样品。", "tags": ["samples", "customization"]}, {"id": 926, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "颜色纹路定制板块", "question": "目前有哪些标准颜色？", "answer": "颜色体系分为基础无机系列和金属色系列。基础无机系列包含白色、中灰、浅灰、水泥灰、米白、米黄、咖啡、棕褐、沙色、灰绿、橄榄绿、蓝色、樱花粉、砖红等；金属色系列包含金属银、金属金、金属咖啡、金属棕、金属绿、金属灰、金属水蓝、金属黑等。", "tags": ["specs", "customization"]}, {"id": 927, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "颜色纹路定制板块", "question": "支持颜色、纹路和图案定制吗？", "answer": "支持。", "tags": ["customization"]}, {"id": 928, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "颜色纹路定制板块", "question": "定制有什么要求和起订量？", "answer": "有开模费一般15000元一款，起订量50平方。", "tags": ["customization", "ordering"]}, {"id": 929, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "样品与大货品质保障板块", "question": "怎么保证样品和大货一致？", "answer": "样板和大货采用同一批原料、同批次装饰膜、同一条生产线生产；合同签订后双方封存样板，大货全部按照封样标准生产。", "tags": ["samples", "specs", "after_sales", "quality"]}, {"id": 930, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "样品与大货品质保障板块", "question": "不同批次允许多大偏差？", "answer": "颜色色差一般控制在行业高标准范围内，肉眼基本看不出明显差别。产品属于艺术水泥材质，允许少量自然深浅色差和直径1mm以内的细小微孔，这些属于正常质感，不算质量问题。", "tags": ["samples", "customization", "specs", "quality", "after_sales"]}, {"id": 931, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "样品与大货品质保障板块", "question": "出厂怎么检验？", "answer": "出厂执行全检 + 抽检结合：\n外观检验：检查色差、缺角、裂纹、麻面、变形、表面瑕疵；\n尺寸抽检：核对长宽厚、平整度、对角尺寸，保证铺贴一致性；\n合格产品贴标识、分类打包，不合格品单独剔除，严禁混入大货", "tags": ["samples", "specs", "installation", "quality", "after_sales"]}, {"id": 932, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "样品与大货品质保障板块", "question": "如果货样不符，怎么处理？", "answer": "经双方核实确属大货与确认样品不一致、非客户现场施工 / 人为损坏问题，我方承担责任； 可选择返工整改、换货、补货， 若少量色差 / 微小视觉差异（行业正常公差范围），提前沟通协调解决方案。\n生产交货周期板块\n现货下单之后最快3天可交货", "tags": ["samples", "installation", "quality", "ordering", "after_sales"]}, {"id": 933, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "样品与大货品质保障板块", "question": "标准常规订单交期多久？", "answer": "基础色7天，金属色15天", "tags": ["samples", "customization", "specs", "quality", "after_sales"]}, {"id": 934, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "样品与大货品质保障板块", "question": "定制产品最长多久？", "answer": "加开模25天左右", "tags": ["samples", "customization", "after_sales", "quality"]}, {"id": 935, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "样品与大货品质保障板块", "question": "旺季会不会延期？", "answer": "旺季或年底高峰期如果模具周转达到上限，可能会顺延5-7天。工厂会调备用副模增加产能，若因厂家原因造成超期，会尽量通过专车直达等方式压缩在途时间。", "tags": ["samples", "after_sales", "quality"]}, {"id": 936, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "包装规格及费用板块", "question": "装箱数量和箱规是多少？", "answer": "包装规格以实际生产为准。比如600x600mm规格，外箱约620x620x150mm，每箱通常装3-4片；小规格如100x50mm每箱约40片，200x200mm每箱约18片，125x250mm每箱约12片，不同产品不一样。出货前会给装箱明细。", "tags": ["shipping", "specs"]}, {"id": 937, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "包装规格及费用板块", "question": "可以定制包装吗？", "answer": "一般不接受。除非几K方的量。", "tags": ["shipping", "specs", "customization"]}, {"id": 939, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "产品核心竞争优势板块", "question": "这款产品的核心卖点是什么？", "answer": "核心卖点主要是水泥原生态质感、立体艺术效果、耐候耐用、环保无机、可定制性强。相比PU、塑料、石膏类仿品，它更适合高端工装、外墙和设计型空间。", "tags": ["certification", "customization", "specs", "usage", "advantages"]}, {"id": 940, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "产品核心竞争优势板块", "question": "和同类产品相比优势在哪里？", "answer": "原材料采用高强度水泥、高纯骨料和进 oduct_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "适用场景范围板块", "question": "潮湿区域能不能用？", "answer": "建议干区墙面。\n外墙、阳台和露天场地适配吗？\n可以。两三年可能颜色会慢慢变浅。\n商场、酒店、学校、医院能批量用吗？\n可以。", "tags": ["customization", "usage"]}, {"id": 950, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "隔音保温性能板块", "question": "保温隔热效果如何？", "answer": "一般。", "tags": ["insulation"]}, {"id": 951, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "施工损耗标准板块", "question": "平整墙面施工损耗大概多少？", "answer": "基层平整、垂直度达标的直铺施工，常规损耗一般控制在1%-2%。", "tags": ["installation", "usage"]}, {"id": 952, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "施工损耗标准板块", "question": "弧形墙面或异形墙面损耗多少？", "answer": "大跨度弧形、多折角或门窗洞口多的墙面，损耗通常会升到3%。", "tags": ["joints", "installation", "usage"]}, {"id": 953, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "施工损耗标准板块", "question": "大批量工程有没有损耗扶持？", "answer": "有。单笔采购总量达到800㎡以上时，厂家通常会额外赠送1.5%-2%左右的同批次同色号产品，作为施工预备件。", "tags": ["partnership", "installation", "ordering"]}, {"id": 954, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "施工环境与工期板块", "question": "100㎡大概多久能完工？", "answer": "两个工人三天", "tags": ["installation"]}, {"id": 955, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "施工环境与工期板块", "question": "施工过程会不会很脏？", "answer": "切割量相对不大，正常施工粉尘和异味都比较可控；如果在指定区域使用带水切割工具，粉尘会更低。", "tags": ["installation"]}, {"id": 956, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "施工环境与工期板块", "question": "完工后多久可以投入使用？", "answer": "一般在胶水和粘结砂浆完成48小时养护后，就可以拆除临时支撑并正常使用。", "tags": ["installation"]}, {"id": 957, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "使用寿命与售后质保板块", "question": "正常使用寿命大概多久？", "answer": "在室内正常环境下，产品可按长期使用设计，官方标称可达10年以上；室外高耐候环境下也有较强耐久性。", "tags": ["after_sales", "usage"]}, {"id": 958, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "日常清洁维护板块", "question": "日常怎么清洁？", "answer": "一般用干布除尘，或者用中性清洁剂配合软布擦拭，再用清水擦净并擦干即可。", "tags": ["maintenance"]}, {"id": 959, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "日常清洁维护板块", "question": "能不能直接用湿布擦洗？", "answer": "不建议", "tags": ["maintenance"]}, {"id": 960, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "日常清洁维护板块", "question": "平时养护要注意什么？", "answer": "注意清扫灰即可", "tags": ["maintenance"]}, {"id": 961, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "物流运输交付板块", "question": "物流怎么安排？", "answer": "通过专门合作的货代运往全球", "tags": ["shipping", "partnership"]}, {"id": 962, "product_id": "3d水泥砖", "product_name": "3D水泥砖", "product_category": "", "section": "验收标准与责任划分板块", "question": "什么情况算次品？", "answer": "产品大崩角。表面开裂。", "tags": ["after_sales"]}, {"id": 963, "product_id": "frp水泥浇筑板产品", "product_name": "FRP水泥浇筑板", "product_category": "", "section": "", "question": "是否区分零售价、批发商价、工程合作价，三类价格具体差异？", "answer": "分的，但不是固定公式，具体这样区分：\n•日常散单/零售：按正常报价单价走，没有固定折扣\n•日常经销商/零散分销：按实际订货数量和长期合作情况单独谈，不是固定折扣\n•工程大单：单次拿货100张以上，直接给到原价6~7折，量越大价格越低，具体来聊", "tags": ["pricing", "partnership", "ordering"]}, {"id": 1032, "product_id": "jz系列软瓷销售话术手册", "product_name": "JZ系列软瓷销售话术手册", "product_category": "", "section": "配套配件", "question": "买板材有没有配套安装配件？", "answer": "板材报价不含粘结剂、美缝剂等辅材。", "tags": ["pricing", "accessories", "installation"]}, {"id": 964, "product_id": "frp水泥浇筑板产品", "product_name": "FRP水泥浇筑板", "product_category": "", "section": "", "question": "报价是否包含税费、运费、装卸费，可开具发票类型、对应税率？", "answer": "我们通常是EXW出厂价，不含运费和包装费、不含装卸、不含税费等等；如果有需要你可以把收货地址发送给我，我会具体查询费用多少。另外如果需要使用我们抬头出口报关，统一加收10%税点，如果你有指定的货代请随时发送给我，我会跟他协商出货事宜。\n原材料价格波动调整机制，价格变动提前通知周期？\n若原材料大幅波动，厂家会提前通过业务对接人员同步价格调整信息，新价格执行前预留合理备货周期。\n大批量采购、长期战略合作客户有无优惠政策、年终返利扶持？\n这个可以单独聊，我们没有固定的返利政策，但是长期合作的客户我们会在价格和排产优先级上有所倾斜，具体来谈。\n产品材质基础参数板块\n产品主要原材料构成、材质等级、详细成分说明？\n树脂+石粉+氧化铁+玻璃纤维为主要原材料。\n材质等级：环保E0  级别。挥发物忽略不计。。\n产品标准长宽尺寸、常规厚度、单平米/单件重量、密度参数\n*常规尺寸：主流规格1200×3200mm、1300×3000mm、600×3150mm、1000×3000mm等，另有蘑菇石、青田石、异形石材、月球灯等特殊定制尺寸；\n*常规厚度：通用厚度3–35mm，部分款式厚度可达3–80mm、10–100mm；\n*重量：标准板材单平米重量15–35kg，单张重量根据尺寸在8.75–35kg不等，异形构件、灯饰类按单件标注重量；\n*尺寸误差标准：整体尺寸误差控制在1–3mm。", "tags": ["certification", "customization", "specs", "partnership", "ordering", "pricing", "shipping"]}, {"id": 965, "product_id": "frp水泥浇筑板产品", "product_name": "FRP水泥浇筑板", "product_category": "", "section": "", "question": "同系列不同款式产品，材质、用料厚度是否保持一致？", "answer": "同系列不同款式可选择水泥、FRP两种基材，同厚度规格用料标准统一；骨料、基材配比保持一致，仅表面纹理、造型工艺不同。FRP与水泥基材物理特性有明显区分（韧性、重量、刚性不同），选购时可按需选定材质。\n订货采购规则板块\n产品最低起订量标准，单款最少订货数量/平方\n常规标准板材最低起订量为10张；异形造型、特殊纹路、超大非标尺寸、定制花色产品无固定起订张数，按定制面积核算，小批量定制需结合模具成本评估订单可行性。\n是否支持零散下单、单件发货，小批量订单价格与大批量差价？\n支持零散下单、单件发货，单件、小批量执行基础报价；大批量订单（工程单、整柜订单）无固定差价比例，可单独洽谈优惠，采购量越大议价空间越高。\n厂家常备现货规格款式范围，无现货产品订货要求？\n主流常规纹理板（木纹、岩石纹、浇筑板、褶板等标准款式）、常规尺寸、标准颜色有现货；特殊异形、定制图案、定制色、超大尺寸、带灯光造型产品无现货，全部为定制生产，需提前下单排产。\n订单下单流程、定金缴纳比例、尾款结算方式、付款相关要求？\n流程是：询价 → 确认款式/尺寸/颜色 → 发PI → 签PI → 付50%定金 → 生产 → 发货前付清尾款 → 发货\n重点：尾款一定要在发货前付清，收到尾款才能安排发货，不垫货。\n样品服务相关板块\n样品申领规则，是否免费提供样品，常规样品规格尺寸？\n常规样品规格为200*300mm小样，样品单价4.8美元/片，不免费；\n样品是否收取工本费、快递运费，大货下单后样品费用能否抵扣货款？\n样品收取工本费，快递运费按收货地址单独核算，由采购方承担；后续下达大批量大货订单后，前期样品工本费可抵扣对应货款。\n样品发货时效，下单后多久可以寄出、签收周期？\n常规现货小样下单后快速安排发货，国际运输整体时效约10–12天；定制款样品根据造型复杂度延长周期，采用DDU交付模式。\n可否一次性提供多款颜色、纹路全套样品？\n颜色纹路定制板块\n厂家现有全套标准色卡、所有常规颜色品类？\n常规标准颜色包含：黑色、白色、浅灰、深灰、土黄、亚光黑、亚光白、金属银、欧洲亚麻、潘通C6浅灰、像树叶红、中国红、泥土芬芳、金秋岁月等；基础色系均沿用立邦标准色卡，常规色打样不额外收费。\n是否支持颜色定制、纹路定制、图案定制服务？\n支持颜色定制。纹路定制需要根据项目情况具体分析并报价。\n定制产品具体要求、定制起订量、额外加工费用？\n定制要求：非常规色卡颜色、亮色（绿色、红色、亮黄等）、专属图案、异形造型、特殊弧度均属于定制范畴；2.加工费用：①非常规颜色单次定制费35.19美元；②绿色、红色等艳色每平米加收2.93美元，亮黄、大红等高亮色每平米加收8.80美元，色浆单价26.39美元/kg；③银色、红色、蓝色等特殊色漆35.19美元/kg，常规色漆11美元/kg，调色单次收费43.99美元；3.定制起订量：500平，复杂定制、开模款式需结合模具成本评估最小订单量。\n起订量越低，价格越高。因为要收取制版费、模具费等。额外加工费用无。\n同批次产品纹路如何统一，怎样避免纹路重复影响整体美观？\n产品采用标准化开模、拓印工艺生产，同批次使用同一套模具与工艺参数，纹路均匀统一；多款连纹款式经过专属纹路设计，大面积铺贴可规避图案重复问题。注：纯手工制作产品每件存在轻微纹理差异，属于产品正常特性。目前，我们的劈开岩、熔积岩、火星岩、四连纹等部分产品，已经实现了无缝隙连纹、无限连纹。纹路重复这个情况无法避免。\n后续补货订单，能否严格把控色差，色差控制标准是什么？\n补货订单优先采用同批次原料、同款模具生产，严控色差；因产品含手工制作环节，补货与首批货物可能存在轻微视觉差异，属于正常范围；若对色差要求极高，建议一次性采购足量货品。\n样品与大货品质保障板块\n如何保证寄送小样与大批量出货产品，质感、厚度、颜色、纹理保持一致？样品与大货采用同源原料、同款生产模具、统一工艺参数制作；出厂前逐件对照标准样品验收，保障质感、厚度、颜色、纹理基本一致。纯手工款式允许存在轻微个体差异，提前告知客户。\n不同生产批次产品，色差、质感允许偏差范围？\n未明确量化色差、质感偏差数值；纯手工制作产品，不同批次、单件之间存在轻微颜色、纹理差异，属于产品固有特性，不作为质量次品判定依据；尺寸统一控制在1–3mm误差范围内。\n产品出厂质检流程、出厂合格标准？\n所有货品出厂前完成全检，重点检测尺寸、表面完整性、纹理、颜色、工艺细节；剔除断裂、大面积缺损、严重变形产品，检验合格后方可打包发货。运输途中产生的边角磕碰、细微毛边，可使用配套修补剂、色浆现场修复。\n若出现货样不符、色差严重等质量问题，厂家处理方案与赔付规则？\n产品退换货：该产品都是人工制作 ，又是定制化产品 ，如无特别严重的质量问题 ：如断裂，大面积缺损等不可预见的情况不接受退换货。如有因物流运输造成的破损等原因 ，本厂可以协助和物流沟通索赔 。\n生产交货周期板块\n现货产品常规下单后发货时长？\n常规现货款式，货款到账后5-7内安排打包发货，整箱货品优先发出。", "tags": ["samples", "customization", "specs", "after_sales", "quality", "ordering", "pricing", "shipping", "installation"]}, {"id": 966, "product_id": "frp水泥浇筑板产品", "product_name": "FRP水泥浇筑板", "product_category": "", "section": "", "question": "标准常规订单生产周期、整体交货时间？", "answer": "标准生产天数7-10天，常规非开模定制板材，生产周期根据订单量、款式复杂度安排；整体交货时长结合生产+国际/国内物流综合核算，国际订单物流时效约30-35天。\n专属定制产品生产周期、最长交货期限？\n颜色定制、图案定制、异形造型、带灯光款式、开模产品生产周期更长，需结合设计方案、模具制作进度确定，下单前请和工厂沟通明确整体交期。\n订单高峰期是否存在延期情况，延期应对处理方案？\n订单旺季排单紧张可能出现延期，建议大客户、工程单提前下单锁定产能；若出现延期，厂家第一时间同步进度并协商调整交期。\n包装规格及费用板块\n产品标准包装方式、包装材质、防护处理工艺？\n标准包装为木箱包装，板与板之间使用珍珠棉隔离缓冲，具备防磕碰、防摩擦功能；异形小件、灯饰类独立分装，整体防护适配长途物流。\n整箱外包装长宽高尺寸、标准装箱数量？\n不同款式、尺寸装箱数量不同：常规大板每箱15–40片，蘑菇石等小件每箱80片，异形石材、月球灯按单件独立包装；包装高度分10cm、20cm、30cm、40cm、60cm多个规格，无统一外箱长宽固定尺寸。\n产品单件净重、整箱毛重详细数据？\n单件净重根据款式、尺寸、厚度区分，范围8.75–35kg/片；整箱毛重=单件净重+木箱+珍珠棉包装重量，具体以发货单标注为准，价格表内已标注主流款式单张净重。\n如需定制专属包装，收费标准如何？\n支持定制品牌专属外包装木箱，包装费用根据箱体尺寸、工艺、材质单独报价。\n包装是否具备防潮、防震、防磕碰、防雨运输防护功能？\n木箱+珍珠棉组合包装，具备防震、防磕碰、防潮基础防护；国际长途运输可额外增加防雨防护，常规包装不做专项防雨处理，户外到货后及时拆包存放。\n包装费用补充 1–5片（10cm包装高度）：61.58美元/箱；5–10片（20cm）：70.38美元/箱；10–20片（30cm）：70.38美元/箱；20–30片（40cm）：87.98美元/箱；30–40片（60cm）：96.77美元/箱。\n产品核心竞争优势板块\n对比市面同类产品，本产品核心优势、主打卖点？\n①双材质可选：水泥板刚性强、防火A级；FRP材质韧性好，可做45°弧度，适用造型场景更广；\n②款式丰富：拥有木纹、岩石、褶皱、竹纹、仿砖、异形石材、发光灯饰等上百种纹理造型，装饰性极强；\n③耐候实用：防水、防潮、防腐蚀，FRP材质不生锈，适配潮湿、沿海等复杂环境；\n④工艺成熟：工业化开模生产，纹理逼真，部分款式可无缝衔接，落地效果佳；⑤施工便捷：重量适中，裁切、粘贴工艺简单，配套专用修补剂与色浆，现场修复方便；\n⑥定制能力强：支持颜色、图案、弧度、灯光一体化定制，适配个性化设计需求。", "tags": ["certification", "customization", "specs", "usage", "advantages", "ordering", "pricing", "shipping", "installation"]}, {"id": 967, "product_id": "frp水泥浇筑板产品", "product_name": "FRP水泥浇筑板", "product_category": "", "section": "资质证书与环保检测板块", "question": "产品具备哪些行业正规证书、第三方权威检测报告？", "answer": "要有\n产品环保等级标准，有无正规环保检测报告？\n产品主体为水泥、玻璃纤维、树脂等常规建材原料，无额外有害挥发物；E0检测报告。\n甲醛及有害物质释放指标，是否符合国内建筑验收标准？\n产品原料不含甲醛、苯等有害挥发物质，主体材质符合国内室内建筑装饰通用验收标准；表面涂料采用立邦正规外墙漆，环保性达标。 有甲醛检测报告\n产品防火等级具体级别，是否具备防火检测报告？\n有燃烧检测报告水泥材质A级，树脂材质有B1级和B2级。有B1级检测报告。", "tags": ["certification", "specs", "usage", "quality", "after_sales"]}, {"id": 968, "product_id": "frp水泥浇筑板产品", "product_name": "FRP水泥浇筑板", "product_category": "", "section": "资质证书与环保检测板块", "question": "防水防潮等级，相关检测资质文件？", "answer": "FRP材质与水泥基材均具备优良防水、防潮、防腐蚀性能，表面涂层采用立邦外墙涂料，自带疏水效果，适配潮湿环境；有报告", "tags": ["certification", "quality", "specs", "usage"]}, {"id": 969, "product_id": "frp水泥浇筑板产品", "product_name": "FRP水泥浇筑板", "product_category": "", "section": "产品物理性能板块", "question": "产品标准承重、抗压、抗弯折性能参数？", "answer": "水泥材质刚性强、抗压性能优异，韧性较差，受大力冲击易崩裂；FRP材质抗拉、抗弯折能力突出，韧性好，可弯折至45°不断裂，抗冲击、抗形变能力优于纯水泥板；", "tags": ["specs"]}, {"id": 970, "product_id": "frp水泥浇筑板产品", "product_name": "FRP水泥浇筑板", "product_category": "", "section": "产品物理性能板块", "question": "产品耐温范围，最高耐受温度、最低耐受温度？", "answer": "FRP与水泥复合板材适配常规室内、半户外温度环境；FRP树脂基材长期高温环境下性能会衰减， 尽量不要超过100度环境实用。最低无要求。；", "tags": ["specs", "usage"]}, {"id": 971, "product_id": "frp水泥浇筑板产品", "product_name": "FRP水泥浇筑板", "product_category": "", "section": "产品物理性能板块", "question": "户外使用耐候性、抗风雨、抗老化性能表现？", "answer": "产品表面涂刷立邦外墙专用漆，具备抗风雨、耐候、自清洁能力，可用于半户外场景；长期露天暴晒会加速FRP树脂、表面涂层老化，全露天户外建议升级户外专用油性漆/氟碳漆做表面防护；FRP材质本身耐酸碱、不生锈，沿海盐雾环境适配性良好。见检测报告", "tags": ["certification", "specs", "usage", "quality", "maintenance"]}, {"id": 972, "product_id": "frp水泥浇筑板产品", "product_name": "FRP水泥浇筑板", "product_category": "", "section": "产品物理性能板块", "question": "长期阳光直射环境下，白色产品是否发黄、深色产品是否褪色，质保年限？", "answer": "不会黄变。那是环氧树脂的问题。褪色10年内肉眼忽略不计。质保5年。国外无质保。", "tags": ["specs", "after_sales"]}, {"id": 973, "product_id": "frp水泥浇筑板产品", "product_name": "FRP水泥浇筑板", "product_category": "", "section": "产品物理性能板块", "question": "人流密集区域受硬物撞击后，产品形态为凹陷还是碎裂？", "answer": "水泥基材为脆性材料，硬物大力撞击易碎裂破洞；FRP材质韧性更佳，轻微撞击不易破损，大力撞击可能出现形变、表层脱落，不易整体碎裂；人流密集区域建议选用加厚板材或FRP材质。\n适用场景范围板块\n产品常规适用安装空间有哪些？\n主流适用于室内墙面、室内吊顶；同时可用于商业展厅、门店、会所、文旅空间、家装背景墙等装饰场景；异形石材、月球灯、发光竹等灯饰款可做氛围造型装饰。\n潮湿区域如浴室、厨房、卫生间是否可以正常安装使用？\n可以正常安装使用。板材防水防潮性能优异，表面涂层疏水防渗水，厨卫等高湿环境适配；施工时做好基层防水、缝隙密封即可。\n外墙、阳台、露天室外场地是否适配？\n有遮蔽的阳台、外廊等半户外场景可直接使用；全露天外墙、露天场地需更换户外专用油性漆/氟碳漆加强防护，基层同步做好防水处理，延长使用寿命。\n商场、酒店、学校、医院、走廊过道等商业公共区域能否工程批量使用？\n完全支持商场、酒店、学校、医院、走廊等公共区域工程批量采购与落地；产品款式多、施工简单、维护便捷，拥有大量公装落地案例，适配大面积批量施工。\n隔音保温性能板块\n产品安装完成后隔音效果、隔音相关参数？\nFRP水泥浇筑板为装饰饰面材料，不具备隔音能力\n是否具备隔热、保温、防寒功能，实际使用效果？\n板材具备基础隔热能力，但单层装饰板保温、防寒效果较弱；若有保温节能需求，可在墙体基层加装岩棉、聚氨酯等保温层，本产品作为外层装饰面板使用。 具备一点。毕竟多了一层。\n施工损耗标准板块\n平整标准墙面常规施工损耗率？\n平整规整的标准墙面，参考建筑幕墙通用施工标准，常规施工损耗率建议预留3%–5%，应对现场裁切、边角轻微破损。\n弧形墙面、异形不规则墙面通用施工损耗比例？\n弧形墙面、异形造型墙面现场裁切量大，施工损耗显著提升，通用损耗比例为10%–20%；建议由现场施工人员勘测造型后核算采购量。\n大批量工程采购有无损耗相关扶持政策？\n大批量工程项目可与厂家协商损耗相关扶持、额外备量优惠，部分合作项目可针对合理损耗提供补货优惠，具体以双方谈判及合同约定为准。\n拼接收口工艺板块\n产品拼接缝隙处理方式，如何淡化拼缝痕迹？\n板材拼接缝隙使用厂家配套补缝剂填充，固化后涂刷同色系色浆遮盖缝隙；浇筑板每3片配套1kg补缝剂，其余款式每2片配套1kg补缝剂，3米长缝隙搭配0.5kg色浆，处理后可大幅淡化拼缝痕迹。\n阴阳角、墙角、踢脚线、门窗连接处标准收口施工工艺？\n无\n配套配件供应板块\n产品配套全套安装配件包含哪些品类？\n标配配套材料：补缝剂、色浆、固化剂（修补专用）；施工工具需自备：无齿锯、水平仪、盒尺、结构胶、气钉等；异形造型、灯饰款无额外专用金属配件。补缝剂配比：1kg补缝剂搭配约20g固化剂。\n配件为原厂统一供应，还是单独报价采购，大批量采购配件配比标准？\n基础修补配件（补缝剂、色浆、固化剂）随货配套提供，按固定比例配送，单独收费；10张配一公斤色浆，11美金一公斤；大批量订单严格按照“浇筑板3片/1kg补缝剂、其他板2片/1kg补缝剂”的标准配比供货，6.6美金一公斤；结构胶、切割工具等施工辅材由采购方本地采购。", "tags": ["certification", "customization", "specs", "accessories", "joints", "usage", "marketing", "installation", "partnership", "insulation", "maintenance", "ordering", "pricing", "after_sales"]}, {"id": 974, "product_id": "frp水泥浇筑板产品", "product_name": "FRP水泥浇筑板", "product_category": "", "section": "产品物理性能板块", "question": "色浆补色剂使用？", "answer": "使用方法：直接均匀涂抹产品上\n备注：施工时先用修补剂把缝隙填上；修补剂填缝后再刷与大板同色的色浆\n修补料使用说明 :到达用户手中的补缝剂是半成品 ，状态比较稀。用户在施工现场 ，需要自行调整浓度 。一般，可以加入水泥粉、滑石粉、快干粉等粉料，边加边搅拌，调整到合适稠度 ，即可施工。\n配比:补缝剂一公斤配上固化剂 20克左右。固化剂用量一般不需要非常精确称量 ，工人都是现场估计一下 。倒入固化剂以后 ，搅拌均匀。即可涂抹补缝。补缝后30分钟，补缝剂凝固干透即可涂刷色浆 。(修补剂只补缝，不用涂到板子上 )\n安装技术相关板块\n产品安装基层条件、基础施工技术要求？\n没啥条件，任何墙面都可以安装。\n完整标准安装流程、施工规范？\n到货验收：检查货品是否断裂、缺角、破损\n裁切：使用无齿锯/瓷砖锯在板材背面裁切，保护表面颜色与纹理；\n基层处理：平整墙面直接施工，凹凸墙面用木工板找平\n粘贴固定：板材背面涂刷结构胶，贴合墙面后用气钉加固", "tags": ["customization", "specs", "usage", "installation", "shipping", "after_sales"]}, {"id": 975, "product_id": "frp水泥浇筑板产品", "product_name": "FRP水泥浇筑板", "product_category": "", "section": "产品物理性能板块", "question": "缝隙修补：缝隙填充补缝剂，固化后涂刷同色系色浆；？", "answer": "收尾清理：清理板面多余辅料，完成施工。FRP材质可弯折做45°弧度造型。\n安装专用胶水型号、辅料指定品类？\n需要工长提供配套的补缝剂和色浆。\n每平方米产品胶水及辅料常规使用消耗量？\n结构胶消耗量根据基层平整度浮动；补缝剂、色浆按板材数量、缝隙长度固定配比配送，无需单独核算每平米用量，配套材料可满足常规施工需求。\n安装辅料配件随货配送，还是采购方自行本地采购？\n原厂修补类辅料（补缝剂、色浆、固化剂）随货品免费配送；结构胶、切割锯、水平仪、气钉等施工工具及通用辅材，建议采购方在当地建材市场采购，降低物流成本。\n厂家是否提供正规安装说明书、施工图纸？\n提供纸质/电子版标准施工说明、施工工艺指引，包含完整安装步骤、辅料配比、收口工艺，无复杂节点施工图纸，常规施工按文字指引即可操作。\n是否提供远程视频技术指导、安装售后答疑服务？\n提供安装售后答疑服务，针对施工难点、缝隙修补、弧度制作等问题对接技术支持；可根据需求提供远程沟通指导。\n施工环境与工期板块\n全屋整体安装标准完工周期？\n小面积家装背景墙、局部造型：1–3天完工；大面积商业工装、整面墙体、吊顶施工：3–15个工作日；弧形、异形造型因裁切、收口工序复杂，工期适当延长。\n施工过程是否产生大量建筑垃圾、粉尘异味？\n板材为工厂预制成品，现场仅少量裁切作业，粉尘少、无明显刺激性异味；建筑垃圾仅为少量裁切边角料，清理简单，老房翻新、已营业场地可正常施工。\n施工完成后多久可以正常投入使用？\n结构胶粘贴后静置固化，补缝剂30分钟左右初步凝固，完全固化结合色浆干燥整体需1–3天；固化完成后即可正常投入使用，产品无有害挥发物，无需通风散味。\n使用寿命与售后质保板块\n产品官方标注正常使用寿命年限？\n水泥基材结构稳定，正常室内使用寿命长久；FRP材质耐腐、抗老化，室内常规使用不易损坏  室内50年。室外20年。，国外发货无质保\n长期使用是否出现变色、开裂、脱落、老化等问题？\n会出现老化问题。任何产品都会老化。开裂脱落不存在。除非安装螺丝钉腐蚀会引起产品脱落。\n产品统一质保期限，质保范围详细说明？\n质保期内非人为质量问题，维修与更换解决方案？\n无质保\n产品表面灰尘、污渍标准清理方式？\n日常浮灰使用干抹布直接擦拭即可；表面纹理凹凸处可用软毛刷清理灰尘，操作简单便捷。\n表面是否支持直接使用清水、湿布擦拭清洁？\n支持清水、湿布直接擦拭；顽固污渍可搭配中性清洁剂（PH6–8）轻柔擦洗；严禁使用强酸、强碱、腐蚀性消毒液，会破坏表面防护涂层。板材表面疏水，清水擦拭后水渍快速风干，无残留。\n产品耐刮耐磨程度，日常养护注意事项？\n表面涂层具备基础耐刮性能，普通轻划不留痕迹；避免尖锐重物大力刮擦、撞击；禁止使用高压水枪直冲板面、高温蒸汽清洁设备清洗；每5–10年可补刷一次表面防护漆，延长使用寿命。\n合作物流运输渠道，整车、零担发货规则？\n国内订单支持整车、零担物流；外贸国际订单按DDU、FOB/CIF等国际贸易条款执行，可配合客户指定货代安排出口；整柜大批量货品优先整车直发，小批量零散货品走零担物流。\n配送范围，送货上门与自提相关规定？\n配送覆盖国内全区域及海外各国；支持客户上门自提（无额外费用），也可代办送货上门，送货费用单独核算；代办物流运输途中的破损问题由厂家协助对接追责", "tags": ["customization", "s cing", "samples", "shipping", "ordering"]}, {"id": 1230, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "样品服务相关板块", "question": "样品发货时效，下单后多久可以寄出、签收周期？", "answer": "答：常备颜色的现货样品，在确认收到样品费和到付信息后，24~48小时内从样品库寄出。采用空运/快递DAP模式，国内核心城市及港口一般3-5个工作日签收，国际空运一般为5-7个工作日。", "tags": ["advantages", "samples", "customization", "ordering"]}, {"id": 1231, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "样品服务相关板块", "question": "可否一次性提供多款颜色、纹路全套样品？", "answer": "答：抱歉，由于电镀色系极多且极易发生表面摩擦刮伤，厂家无法免费一次性提供全套实物样品组合。建议客户根据设计需求挑选3-4款核心色", "tags": ["advantages", "samples", "customization"]}, {"id": 1232, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "颜色纹路定制板块", "question": "厂家现有全套标准色卡、所有常规颜色品类？", "answer": "答：厂家无法提供印刷版的标准纸质色卡，因为金属电镀层的折射率和多角度色泽受环境光源影响巨大。我们提供实物金属板作为颜色参考。常规颜色品类包含8大明星色系：钛金色（香槟金）、亮银色（镜面铬）、黑金（冷枪黑）、玫瑰金、古铜金、炫彩极光色、宝石蓝以及幻彩绿。", "tags": ["samples", "specs", "customization"]}, {"id": 1233, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "颜色纹路定制板块", "question": "是否支持颜色定制、纹路定制、图案定制服务？", "answer": "答：完全支持。客户可提供标准实物样板或指定国际劳尔/潘通色卡号进行对色定制。表面凹凸纹路及底模图案的深度定制需要单独咨询工程师进行磨具评测。由于艺术电镀砖本身肌理已足够丰富，一般建议在常规纹路上做色彩变幻，不建议盲目更改底模以避免高昂的开模费用。", "tags": ["samples", "customization"]}, {"id": 1234, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "颜色纹路定制板块", "question": "定制产品具体要求、定制起订量、额外加工费用？", "answer": "答：定制要求：采购方需提供CAD矢量图纸、高清纹理图或标准实物对色样。打样及调机周期通常为5-7天。起订量与额外产生的开模费、高昂靶材费需要根据实际定制的复杂程度一项目一议。", "tags": ["customization", "ordering"]}, {"id": 1235, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "颜色纹路定制板块", "question": "同批次产品纹路如何统一，怎样避免纹路重复影响整体美观？", "answer": "砖体由高精度模具一体压制，同批次产品纹路、尺寸、深浅高度统一。 大面积铺贴时，建议将砖块交错摆放，或旋转 90°、180° 拼接，避免纹路呆板，视觉效果更自然", "tags": ["joints", "specs", "customization", "installation"]}, {"id": 1236 estion": "箱子印 LOGO 定制怎么收费？", "answer": "定制带 LOGO、专属文字的纸箱，最低起订 2000 个。仅收取 500~800 元制版费，纸箱按成本价计算；单次订单总货款满 10 万元，免收制版费，定制包装无额外加价\n包装能防潮防雨防震吗？\n内部包装防震、防磕碰效果优异；外层缠绕膜可防潮、短时防雨。因外包装为纸箱，运输和工地露天存放时，务必做好遮盖，避免长时间泡水。", "tags": ["shipping", "specs", "customization", "ordering"]}, {"id": 1249, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "产品核心竞争优势板块", "question": "对比市面同类产品，本产品核心优势、主打卖点？", "answer": "产品镜面金属质感强，采用 PVD 真空电镀工艺，镀层附着力强、不脱皮、抗氧化、耐盐雾。\n对比传统水镀砖，解决了易发黑、掉皮、生锈的问题；对比整体金属墙板，采购成本降低近 80%。瓷质 / 玻璃基材防潮性好，适配 KTV、会所、轻奢装饰场景。", "tags": ["advantages", "specs", "ordering", "usage"]}, {"id": 1250, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "产品核心竞争优势板块", "question": "工艺优势、原材料优势、性价比优势、工程落地优势详细介绍？", "answer": "工艺：大型真空电镀设备，金属层与砖体结合紧密，外层加防指纹纳米釉，硬度高、耐刮擦。\n原料：砖体致密、吸水率低，电镀使用高纯度金属原料，品质稳定。\n性价比：自有工厂规模化生产，成本比小作坊低 15% 以上，价格优势明显。\n工程落地：配套完整施工图与专用辅料，支持带膜施工，避免刮花表面，施工门槛低。十、资质证书与环保检测板块", "tags": ["certification", "specs", "accessories", "quality", "advantages", "pricing", "installation"]}, {"id": 1251, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "产品核心竞争优势板块", "question": "产品具备哪些行业正规证书、第三方权威检测报告？", "answer": "拥有 ISO9001 质量体系认证、建材附着力 & 耐磨检测报告；可满足酒店、商场、KTV 等大型公装项目报验要求。", "tags": ["advantages", "quality", "certification", "usage"]}, {"id": 1252, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "产品核心竞争优势板块", "question": "产品环保等级标准，有无正规环保检测报告？", "answer": "符合国家 GB 6566-2010 标准中A 类绿色装饰材料要求，生产无废水、重金属污染，配有正规环保检测报告，室内外均可使用。", "tags": ["certification", "specs", "usage", "advantages", "quality"]}, {"id": 1253, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "产品核心竞争优势板块", "question": "甲醛及有害物质释放指标，是否符合国内建筑验收标准？", "answer": "答：本产品经过千度烧结及真空金属沉积，其**甲醛、苯、氡、总挥发性有机物（VOC）等有毒有害物质释放量绝对为0（未检出）**。100%优于并符合国内最新的《民用建筑工程室内环境污染控制标准》（GB 50325-2020）的最严苛验收指标。", "tags": ["certification", "specs", "usage", "advantages", "after_sales"]}, {"id": 1254, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "产品核心竞争优势板块", "question": "产品防火等级具体级别，是否具备防火检测报告？", "answer": "防火等级为A1 级不燃材料，遇火不燃烧、不产生浓烟和有毒气体，附带国家级防火检测报告。", "tags": ["advantages", "quality", "specs", "certification"]}, {"id": 1255, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "产品核心竞争优势板块", "question": "产品防水防潮等级，相关检测资质文件？", "answer": "砖体吸水率极低（全瓷基底≤0.5%，玻璃基底吸水率为 0），电镀层疏水防潮，配有国家级耐水、防潮专项检测证书，属于高档防水建材。", "tags": ["advantages", "quality", "specs", "certification"]}, {"id": 1256, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "产品物理性能板块", "question": "产品标准承重、抗压、抗弯折性能参数？", "answer": "瓷质基底平均抗压强度≥60MPa，硬度较好。但砖体偏薄、材质偏脆，仅可做墙面装饰、背景墙、吧台饰面，不能作为建筑主梁、立柱等主力承重结构。", "tags": ["specs", "usage"]}, {"id": 1257, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "产品物理性能板块", "question": "产品耐温范围，最高耐受温度、最低耐受温度？", "answer": "常规使用温度：-30℃ ~ +80℃；急冷急热温差达到 60℃，镀层不开裂、不起皮；短时极限耐受温度 150℃。", "tags": ["after_sales"]}, {"id": 1258, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "产品物理性能板块", "question": "户外使用耐候性、抗风雨、抗老化性能表现？", "answer": "常规款不建议大面积露天使用，长期强紫外线、酸雨会导致彩色 / 亮面镀层变暗。户外项目可定制带抗 UV 防护釉的室外专用款", "tags": ["customization", "usage"]}, {"id": 1259, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "产品物理性能板块", "question": "长期阳光直射环境下，白色产品是否发黄、深色产品是否褪色，质保年限？", "answer": "室内正常光照、灯光照射下，产品不发黄、不褪色。由于建材类产品不像电子产品，出厂后人为干扰的因素太多，所以无法提供质保。", "tags": ["after_sales", "usage"]}, {"id": 1277, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "安装技术相关板块", "question": "厂家是否提供正规安装说明书、施工图纸？", "answer": "不提供", "tags": ["installation"]}, {"id": 1260, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "产品物理性能板块", "question": "人流密集区域受硬物撞击后，产品形态为凹陷还是碎裂？", "answer": "表面镀层莫氏硬度 5.5~6 级，日常钥匙、衣物摩擦、轻微磕碰不留痕迹。遭遇强力尖锐撞击，仅局部崩边、出现细纹，不会像普通玻璃一样碎渣飞溅，安全性高。", "tags": ["specs"]}, {"id": 1261, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "适用场景范围板块", "question": "产品常规适用安装空间有哪些？", "answer": "KTV 大堂 / 包厢背景墙、酒吧吧台、酒店走廊 / 电梯厅、奢侈品展厅、网红门店、轻奢家装电视墙、艺术楼梯等高端商业、家装空间。", "tags": ["installation", "usage"]}, {"id": 1262, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "适用场景范围板块", "question": "潮湿区域如浴室、厨房、卫生间是否可以正常安装使用？", "answer": "厨房、卫生间、浴室干燥区域、玄关可正常铺贴，搭配防霉胶即可。可以用在淋浴房，但是要做好防水。", "tags": ["certification", "installation", "usage"]}, {"id": 1263, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "适用场景范围板块", "question": "外墙、阳台、露天室外场地是否适配？", "answer": "带顶棚的阳台、半户外走廊、局部景观造型可正常使用。纯露天外墙、无遮挡户外区域，必须定制室外耐候专用款，不可直接使用室内常规砖。", "tags": ["customization", "usage"]}, {"id": 1264, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "适用场景范围板块", "question": "商场、酒店、学校、医院、走廊过道等商业公共区域能否工程批量使用？", "answer": "支持商场、酒店、医院、走廊等公共场所大批量工程采购，产品防火、耐磨、易清洁，是主流公装装饰材料。", "tags": ["certification", "specs", "usage", "maintenance", "ordering"]}, {"id": 1265, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "隔音保温性能板块", "question": "产品安装完成后隔音效果、隔音相关参数？", "answer": "无隔音", "tags": ["specs", "insulation", "installation"]}, {"id": 1266, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "隔音保温性能板块", "question": "是否具备隔热、保温、防寒功能，实际使用效果？", "answer": "答：具备无机高密度陶瓷建材的基础蓄热性能。它的热惰性可以协助基墙延缓室内外温度的剧烈传导。虽然不能直接替代专业的挤塑板等保温棉，但在实际工程落地应用中，贴有电镀艺术砖的复合背景墙在夏季能阻挡部分外部热辐射，冬季减少室内空调暖气的散失，为商业及居家空间提供辅助微调的低碳节能成效。", "tags": ["specs", "insulation", "usage"]}, {"id": 1267, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "施工损耗标准板块", "question": "平平整标准墙面常规施工损耗率？", "answer": "规整平面墙面，熟练工人标准化施工，损耗率3%~5%", "tags": ["installation", "usage"]}, {"id": 1268, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "施工损耗标准板块", "question": "弧形墙面、异形不规则墙面通用施工损耗比例？", "answer": "不能\n大批量工程采购有无损耗相关扶持政策？\n没有", "tags": ["partnership", "installation", "ordering", "usage"]}, {"id": 1269, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "拼接收口工艺板块", "question": "产品拼接缝隙处理方式，如何淡化拼缝痕迹？", "answer": "使用高透无影胶，或与砖体同色的金属环氧美缝剂，预留 1~1.5mm 细缝，搭配透明定位卡对齐。金属表面反光会弱化缝隙痕迹，整体观感更统一。", "tags": ["joints", "specs", "installation"]}, {"id": 1270, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "拼接收口工艺板块", "question": "阴阳角、墙角、踢脚线、门窗连接处标准收口施工工艺？", "answer": "·  阳角：优先使用原厂 L 型转角砖；现场加工必须在砖体背面磨 45° 角，严禁正面打磨。\n·  阴角：直接对缝铺贴，再用同色防霉胶密封。\n·  踢脚线 / 门窗边：预埋不锈钢 / 铝合金 U 型卡槽，槽内加装防震胶条，砖块卡入卡槽后，外围打透明耐候胶收边。", "tags": ["joints", "specs", "installation"]}, {"id": 1271, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "配套配件供应板块", "question": "产品配套全套安装配件包含哪些品类？", "answer": "无\n配件为原厂统一供应，还是单独报价采购，大批量采购配件配比标准？\n无", "tags": ["pricing", "accessories", "installation", "ordering"]}, {"id": 1272, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "安装技术相关板块", "question": "产品安装基层条件、基础施工技术要求？", "answer": "墙面必须结实、不起砂、不空鼓，优先实心墙、混凝土墙、加厚木工板。 墙面平整度、垂直度误差控制在 ±2mm 以内。 轻钢龙骨石膏板这类轻质墙，必须提前加固，不能直接贴砖。", "tags": ["installation", "usage"]}, {"id": 1273, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "安装技术相关板块", "question": "完整标准安装流程、施工规范？", "answer": "·  墙面弹线，确定排砖位置和标高；\n·  清理墙面，涂刷界面剂；\n·  砖体和墙面双面涂抹专用粘结剂；\n·  铺贴砖块，用橡胶锤敲实，插入定位卡；全程保留表面保护膜，不要提前撕掉；\n·  全部贴完静置 24~48 小时，拔掉定位卡、做美缝；工程完工后再统一撕除保护膜。", "tags": ["installation", "usage"]}, {"id": 1274, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "安装技术相关板块", "question": "安装专用胶水型号、辅料指定品类？", "answer": "指定使用中性环氧粘结剂，或国内大牌专用瓷砖胶。严禁使用酸性玻璃胶、普通水泥砂浆，会腐蚀电镀层、导致发黑起皮。", "tags": ["specs", "accessories", "installation"]}, {"id": 1275, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "安装技术相关板块", "question": "每平方米产品胶水及辅料常规使用消耗量？", "answer": "答：以常规 50×200×8mm 电镀艺术长条砖、设计标准灰缝 1.5mm、采用标准齿形薄贴法为例，**每平方米墙面常规需要消耗专用强效中性粘结胶泥约 4.0 - 5.0 kg**；十字透明定位卡标准消耗量约为 52 - 55 个/平方米。", "tags": ["accessories", "installation", "usage"]}, {"id": 1276, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "安装技术相关板块", "question": "安装辅料配件随货配送，还是采购方自行本地采购？", "answer": "本地采购、不用给我们审核", "tags": ["accessories", "installation", "ordering"]}, {"id": 1278, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "安装技术相关板块", "question": "是否提供远程视频技术指导、安装售后答疑服务？", "answer": "施工期间工程师提供远程视频指导，现场遇到技术问题，2 小时内给出解决方案。", "tags": ["marketing", "after_sales", "installation"]}, {"id": 1279, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "施工环境与工期板块", "question": "全屋整体安装标准完工周期？", "answer": "15~20㎡的背景墙，两名工人配合施工，1~2 天就能全部做完。", "tags": ["installation", "usage"]}, {"id": 1280, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "施工环境与工期板块", "question": "施工过程是否产生大量建筑垃圾、粉尘异味？", "answer": "采用胶泥薄贴工艺，没有水泥扬尘、泥浆垃圾，只有少量裁切砖体的碎料。所用辅料都是环保款，基本没有异味。", "tags": ["certification", "specs", "accessories", "installation"]}, {"id": 1281, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册", "product_category": "", "section": "施工环境与工期板块", "question": "施工完成后多久可以正常投入使用？", "answer": "铺贴完成 24 小时，胶泥基本固化，可进行其他工序；完成施工后7天完全凝固，30天后再美缝。", "tags": ["installation"]}, {"id": 1282, "product_id": "电镀砖通用供应商调研问答手册", "product_name": "电镀砖通用供应商调研问答手册" var $=function(id){return document.getElementById(id)};

var st=null;
function tokenize(t){
 var m=t.match(/[^\s,.!?;:，。！？；：]+/g)||[];
 var r=m.slice();
 m.forEach(function(x){if(x.length>1)for(var i=0;i<x.length-1;i++)r.push(x.slice(i,i+2))});
 return r
}
function doSearch(){
 var q=si.value.trim();
 if(!q){ra.style.display="none";nr.style.display="none";es.style.display="";return}
 var tokens=tokenize(q);
 var scored=ALL.map(function(e){
  var s=0;
  var pn=(e.product_name||"").toLowerCase();
  var qu=(e.question||"").toLowerCase();
  var an=(e.answer||"").toLowerCase();
  for(var i=0;i<tokens.length;i++){
   var t=tokens[i].toLowerCase();
   if(pn.indexOf(t)>=0)s+=4;
   if(qu.indexOf(t)>=0)s+=2;
   if(an.indexOf(t)>=0)s+=1
  }
  return{row:e,score:s}
 }).filter(function(x){return x.score>0});
 scored.sort(function(a,b){return b.score-a.score});

 }).join("")
}
