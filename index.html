<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STEPS 产品问答系统</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo-box"><div class="logo-icon">S</div><span class="logo-text">STEPS</span></div>
    <div class="subtitle">Product Q&A System</div>
  </header>
  <main class="main">
    <div class="hero"><h2>内部产品资料快速查找</h2><p>输入关键词，即可快速查找所需产品的规格、价格、施工说明等资料</p></div>
    <div class="search-wrap">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="试试搜索：起订量是多少？WPC是什么材质？价格怎么算？" autocomplete="off" autofocus>
        <button class="search-btn" id="searchBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>搜 索</button>
      </div>
      <div class="search-hint">支持搜索：产品名称、材质参数、价格报价、订货规则、施工安装等</div>
    </div>
    <div id="resultsArea" class="results-area" style="display:none">
      <div class="results-summary"><span id="resultsCount" class="results-count"></span><span class="results-query">搜索：<strong id="resultsQuery"></strong></span></div>
      <div id="resultsList"></div>
    </div>
    <div id="emptyState" class="empty-state">
      <div class="empty-icon"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div>
      <div class="empty-text">输入产品相关问题，快速获取答案</div><div class="empty-sub">或点击下方产品查看</div>
      <div class="product-tags-row" id="productTags"></div>
    </div>
    <div id="noResults" class="no-results" style="display:none">
      <div class="no-results-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.2"><circle cx="12" cy="12" r="10"/><path d="m8 8 8 8M8 16l8-8"/></svg></div>
      <div>未找到相关产品信息，请尝试其他关键词</div>
    </div>
  </main>
  <footer class="footer"><span>STEPS &copy; 2026</span><span> &nbsp; &middot; &nbsp; </span><span>内部资料系统</span></footer>
</div>
<div id="loading" class="loading-overlay" style="display:none"><div class="spinner"></div></div>
<script>
var SUPABASE_URL="https://rstbdvgjgjscxuqzylzw.supabase.co",SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzdGJkdmdqZ2pzY3h1cXp5bHp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxMzY5NzUsImV4cCI6MjEwMDcxMjk3NX0.T59_xNg9rGd9OlhmevHc4-s_pka3mPjlL8rpzlsPJXs";
var el=function(id){return document.getElementById(id)};
var si=el("searchInput"),sb=el("searchBtn"),ra=el("resultsArea"),rl=el("resultsList"),rc=el("resultsCount"),rq=el("resultsQuery"),es=el("emptyState"),nr=el("noResults"),ld=el("loading"),pt=el("productTags");
var st=null,colors=["c1","c2","c3","c4"],dc=["blue","emerald","amber","violet"],ad=[],pm=new Map();
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}
async function loadAllData(){ld.style.display="flex";try{var u=SUPABASE_URL+"/rest/v1/qa_entries?select=*&limit=1000";var r=await fetch(u,{headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Accept":"application/json"}});var j=await r.json();if(Array.isArray(j)){ad=j;ad.forEach(function(row){if(!pm.has(row.product_id))pm.set(row.product_id,{id:row.product_id,name:row.product_name,cat:row.product_category})})}else{console.error("Not an array:",j)}ld.style.display="none";renderProductTags()}catch(e){ld.style.display="none";console.error("Load failed:",e)}}
function renderProductTags(){var arr=Array.from(pm.values());if(arr.length===0)return;pt.innerHTML=arr.map(function(p,i){return '<span class="product-tag" data-query="'+p.name+'"><span class="tag-dot '+dc[i%4]+'"></span>'+p.name+"</span>"}).join("");document.querySelectorAll(".product-tag").forEach(function(t){t.addEventListener("click",function(){si.value=t.dataset.query;doSearchLocal()})})}
function tokenize(t){var tokens=t.match(/[一-鿿\w]+/g)||[t];var r=[].concat(tokens);tokens.forEach(function(x){if(x.length>2)for(var i=0;i<x.length-1;i++)r.push(x.slice(i,i+2))});return Array.from(new Set(r)).filter(function(x){return x.length>=1})}
function doSearchLocal(){var q=si.value.trim();if(!q){ra.style.display="none";nr.style.display="none";es.style.display="";return}if(ad.length===0){loadAllData().then(doSearchLocal);return}var tokens=tokenize(q);var scored=ad.map(function(row){var score=0;var name=(row.product_name||"").toLowerCase();tokens.forEach(function(t){var tl=t.toLowerCase();if(name.indexOf(tl)>=0)score+=3});var q1=(row.question||"").toLowerCase();tokens.forEach(function(t){var tl=t.toLowerCase();if(q1.indexOf(tl)>=0)score+=2});var a1=(row.answer||"").toLowerCase();tokens.forEach(function(t){var tl=t.toLowerCase();if(a1.indexOf(tl)>=0)score+=1});if(row.keywords&&Array.isArray(row.keywords)){row.keywords.forEach(function(kw){var kl=(kw||"").toLowerCase();tokens.forEach(function(t){var tl=t.toLowerCase();if(kl.indexOf(tl)>=0||tl.indexOf(kl)>=0)score+=1})})}return{row:row,score:score}}).filter(function(s){return s.score>0});scored.sort(function(a,b){return b.score-a.score});if(scored.length===0){ra.style.display="none";es.style.display="none";nr.style.display="";return}es.style.display="none";nr.style.display="none";ra.style.display="";rc.textContent="共找到 "+scored.length+" 条相关问答";rq.textContent=q;var grouped={};scored.forEach(function(s){var pid=s.row.product_id;if(!grouped[pid]){grouped[pid]={product_name:s.row.product_name,product_category:s.row.product_category,entries:[]}}grouped[pid].entries.push(s.row)});var groups=Object.values(grouped);var gi=0;rl.innerHTML=groups.map(function(g){var cards=g.entries.slice(0,8).map(function(e){return '<div class="result-card"><div class="card-meta"><span class="card-badge">'+esc(e.section)+'</span></div><div class="card-q">'+esc(e.question)+'</div><div class="card-a">'+esc(e.answer).replace(/\n/g,"<br>")+"</div></div>"}).join("");var more=g.entries.length>8?'<div class="card-more">还有 '+(g.entries.length-8)+" 条相关问答未显示</div>":"";var color=colors[gi%4];gi++;return '<div class="product-group"><div class="group-header"><div class="group-color '+color+'"></div><span class="group-name">'+esc(g.product_name)+'</span><span class="group-cat">'+esc(g.product_category)+'</span><span class="group-num">'+g.entries.length+" 条匹配</span></div>"+cards+more+"</div>"}).join("")}
function doSearch(){if(ad.length===0){loadAllData().then(doSearchLocal)}else{doSearchLocal()}}
si.addEventListener("input",function(){clearTimeout(st);st=setTimeout(doSearch,300)});
si.addEventListener("keydown",function(e){if(e.key==="Enter"){clearTimeout(st);doSearch()}});
sb.addEventListener("click",doSearch);
loadAllData();
</script>
</body>
</html>
