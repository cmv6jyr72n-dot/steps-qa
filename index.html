<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STEPS STEPS 产品问答系统</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh}
.app{max-width:860px;margin:0 auto;padding:0 24px;min-height:100vh;display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:center;padding:40px 0 24px;flex-direction:column}
.logo-box{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,#1e3a5f,#2563eb);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;box-shadow:0 4px 12px rgba(37,99,235,.25)}
.logo-text{font-size:26px;font-weight:700;color:#0f172a;letter-spacing:-.5px}
.subtitle{font-size:13px;color:#64748b;letter-spacing:2px;text-transform:uppercase}
.main{flex:1;padding-bottom:48px}
.hero{text-align:center;padding:32px 0 40px}
.hero h2{font-size:22px;font-weight:600;color:#1e293b;margin-bottom:8px}
.hero p{font-size:14px;color:#64748b;max-width:480px;margin:0 auto;line-height:1.6}
.search-wrap{position:relative;max-width:640px;margin:0 auto 24px}
.search-box{display:flex;align-items:center;background:#fff;border:2px solid #e2e8f0;border-radius:14px;padding:4px 4px 4px 20px;transition:all .25s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.search-box:focus-within{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.1),0 4px 16px rgba(0,0,0,.06)}
.search-box input{flex:1;border:none;outline:none;font-size:15px;padding:12px 0;color:#1e293b;background:transparent;font-family:inherit}
.search-box input::placeholder{color:#94a3b8}
.search-btn{background:#2563eb;border:none;color:#fff;padding:10px 20px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;transition:all .2s;font-family:inherit;white-space:nowrap}
.search-btn:hover{background:#1d4ed8;box-shadow:0 2px 8px rgba(37,99,235,.3)}
.search-btn svg{width:18px;height:18px}
.search-hint{text-align:center;font-size:12px;color:#94a3b8;margin-top:12px}
.product-tags-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px}
.product-tag{display:inline-flex;align-items:center;gap:4px;padding:8px 16px;background:#fff;border:1px solid #e2e8f0;border-radius:24px;font-size:13px;color:#475569;cursor:pointer;transition:all .2s;font-family:inherit}
.product-tag:hover{background:#eff6ff;border-color:#2563eb;color:#2563eb;transform:translateY(-1px);box-shadow:0 2px 8px rgba(37,99,235,.1)}
.product-tag .tag-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.tag-dot.blue{background:#2563eb}
.tag-dot.amber{background:#d97706}
.tag-dot.emerald{background:#059669}
.tag-dot.violet{background:#7c3aed}
.results-area{margin-top:8px}
.results-summary{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding:0 4px}
.results-count{font-size:13px;color:#64748b;font-weight:500}
.results-query{font-size:13px;color:#94a3b8}
.results-query strong{color:#2563eb;font-weight:600}
.product-group{margin-bottom:20px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid #e2e8f0}
.group-header{display:flex;align-items:center;gap:10px;padding:14px 20px;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.group-color{width:3px;height:28px;border-radius:2px;flex-shrink:0}
.group-color.c1{background:#2563eb}
.group-color.c2{background:#059669}
.group-color.c3{background:#d97706}
.group-color.c4{background:#7c3aed}
.group-name{font-size:15px;font-weight:600;color:#0f172a}
.group-cat{font-size:11px;color:#94a3b8;background:#f1f5f9;padding:3px 10px;border-radius:4px;font-weight:500}
.group-num{font-size:12px;color:#2563eb;margin-left:auto;font-weight:500}
.result-card{padding:18px 20px;border-bottom:1px solid #f1f5f9;transition:background .15s;cursor:default}
.result-card:last-child{border-bottom:none}
.result-card:hover{background:#f8fafc}
.card-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card-badge{font-size:10px;color:#64748b;background:#f1f5f9;padding:2px 8px;border-radius:4px;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.card-q{font-size:14px;font-weight:600;color:#1e293b;margin-bottom:10px;line-height:1.5}
.card-a{font-size:14px;color:#475569;line-height:1.7;white-space:pre-line}
.card-more{text-align:center;padding:12px;font-size:12px;color:#94a3b8;background:#f8fafc;border-top:1px solid #f1f5f9}
.empty-state{text-align:center;padding:48px 0}
.empty-icon{margin-bottom:20px;opacity:.4}
.empty-text{font-size:15px;color:#94a3b8;margin-bottom:4px}
.empty-sub{font-size:13px;color:#cbd5e1}
.no-results{text-align:center;padding:48px 0}
.no-results-icon{opacity:.3;margin-bottom:16px}
.no-results div{color:#94a3b8;font-size:14px}
.loading-overlay{position:fixed;inset:0;background:rgba(241,245,249,.7);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.spinner{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;padding:20px 0;font-size:11px;color:#cbd5e1;border-top:1px solid #e2e8f0;margin-top:auto}
@media(max-width:640px){.app{padding:0 16px}.header{padding:28px 0 18px}.logo-text{font-size:22px}.hero{padding:20px 0 28px}.hero h2{font-size:18px}.search-box{border-radius:12px;padding:3px 3px 3px 14px}.search-box input{font-size:14px;padding:10px 0}.search-btn{padding:8px 14px;font-size:13px;border-radius:8px}.result-card{padding:14px 16px}.group-header{padding:12px 16px}}</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo-box">
      <div class="logo-icon">S</div>
      <span class="logo-text">STEPS</span>
    </div>
    <div class="subtitle">Product Q A System</div>
  </header>
  <main class="main">
    <div class="hero">
      <h2>STEPS 产品问答系统_HERE</h2>
      <p>输入关键词，即可快速查找所需产品的规格、价格、施工说明等资料</p>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="试试搜索：起订量是多少？WPC是什么材质？价格怎么算？" autocomplete="off" autofocus>
        <button class="search-btn" id="searchBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          搜索
        </button>
      </div>
      <div class="search-hint">支持搜索：产品名称、材质参数、价格报价、订货规则、施工安装等</div>
    </div>
    <div id="resultsArea" class="results-area" style="display:none">
      <div class="results-summary">
        <span id="resultsCount" class="results-count"></span>
        <span class="results-query">搜索： <strong id="resultsQuery"></strong></span>
      </div>
      <div id="resultsList"></div>
    </div>
    <div id="emptyState" class="empty-state">
      <div class="empty-icon">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </div>
      <div class="empty-text">输入产品相关问题，快速获取答案</div>
      <div class="empty-sub">或点击下方产品查看</div>
      <div class="product-tags-row" id="productTags"></div>
    </div>
    <div id="noResults" class="no-results" style="display:none">
      <div class="no-results-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.2"><circle cx="12" cy="12" r="10"/><path d="m8 8 8 8M8 16l8-8"/></svg>
      </div>
      <div>未找到相关产品信息，请尝试其他关键词</div>
    </div>
  </main>
  <footer class="footer">
    <span>STEPS STEPS &copy; 2026 &nbsp; &middot; &nbsp; 内部资料系统</span>
  </footer>
</div>
<div id="loading" class="loading-overlay" style="display:none"><div class="spinner"></div></div>
JS_试试搜索：起订量是多少？WPC是什么材质？价格怎么算？
</body>
</html>
